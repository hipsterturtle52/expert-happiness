<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}

button{font:inherit;color:inherit}

h2{font-size:1.3rem}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.6rem;height:52px;padding:0 1rem;background:var(--panel);border-bottom:1px solid var(--line)}

nav#nav{position:sticky;top:52px;width:250px;flex:none;height:calc(100vh - 52px);overflow-y:auto;padding:1rem .6rem 2rem;border-right:1px solid var(--line)}
nav#nav a{display:flex;justify-content:space-between;gap:.4rem;padding:.32rem .6rem;border-radius:7px;text-decoration:none;color:var(--ink);font-size:.92rem}
nav#nav a:hover{background:var(--soft)}
nav#nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav#nav .sec{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:1rem .6rem .3rem}
nav#nav .mk{font-size:.78rem;color:var(--muted)}
nav#nav .mk.done{color:var(--ok)}

 #menuBtn{display:inline-block}
 nav#nav{position:fixed;left:0;top:52px;z-index:30;background:var(--panel);transform:translateX(-105%);transition:transform .2s;box-shadow:0 8px 30px rgba(0,0,0,.25)}
 body.navopen nav#nav{transform:none}
 main#view{padding:1rem 1rem 4rem}
}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;margin:1rem 0;box-shadow:var(--shadow)}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}

const UNITS = [];   // filled by U({...}) blocks below
const QB = [];      // filled by Q(...) calls below
function U(o){ UNITS.push(o); }
/* Q(unit, set, difficulty, stem, options, explanations)
   set: q = unit quiz, d = diagnostic, a = practice exam 1, b = practice exam 2
   difficulty: E / M / H. In the source the CORRECT option is always written first;

</script>

<!-- ============ UNIT CONTENT ============ -->
<script>
U({id:"u1",area:"persp",weight:10,minutes:17,title:"History of Sociology & Major Theories",
intro:"Who founded sociology, what each founder argued, and the three big lenses (functionalism, conflict, symbolic interactionism) that show up in questions across every unit.",
must:[
"<b>Auguste Comte</b> coined “sociology” and championed <b>positivism</b>: studying society with the methods of natural science. Law of three stages: theological → metaphysical → positive (scientific).",
"<b>Émile Durkheim</b>: <b>social facts</b> (external forces that constrain individuals); <i>Suicide</i> showed suicide rates rise and fall with social <b>integration</b> and <b>regulation</b>; <b>anomie</b> = normlessness; <b>mechanical</b> (sameness, traditional) vs. <b>organic</b> (interdependence, modern) solidarity.",
"<b>Karl Marx</b>: history is class conflict; <b>bourgeoisie</b> own the <b>means of production</b>, <b>proletariat</b> sell their labor; <b>false consciousness</b> vs. <b>class consciousness</b>; <b>alienation</b>.",
"<b>Max Weber</b>: <b>verstehen</b> (understand action from the actor's view); <i>The Protestant Ethic and the Spirit of Capitalism</i>; <b>rationalization</b> and <b>bureaucracy</b>; <b>ideal type</b>; <b>value-free</b> research.",
"<b>C. Wright Mills</b>: the <b>sociological imagination</b> links personal troubles to public issues (history + biography).",
"<b>Functionalism</b> (macro): society as a system of parts that maintain stability — Durkheim, Parsons, <b>Merton</b> (manifest vs. <b>latent</b> functions, <b>dysfunctions</b>).",
"<b>Conflict theory</b> (macro): society as competition over scarce resources and power — Marx, Mills, Dahrendorf, Coser, Collins.",
"<b>Symbolic interactionism</b> (micro): people act on shared meanings created in interaction — Mead, Cooley, Blumer (named it), Goffman's <b>dramaturgy</b>.",
"<b>Thomas theorem</b>: “If people define situations as real, they are real in their consequences.”",
"Firsts: <b>Spencer</b> — “survival of the fittest,” social Darwinism; <b>Martineau</b> — translated Comte, first woman sociologist; <b>Du Bois</b> — <i>The Philadelphia Negro</i>, double consciousness; <b>Addams</b> — Hull House; first U.S. department at the University of Chicago (1892)."
],
lesson:`
<h3>What sociology is</h3>
<p><b>Sociology</b> is the systematic, scientific study of society, social groups, and social behavior. Psychology asks what is going on inside an individual; sociology asks how the groups and structures around people shape what they do.</p>
<p>The key habit is what <b>C. Wright Mills</b> (1959) called the <b>sociological imagination</b>: seeing the link between <b>personal troubles</b> (my own unemployment) and <b>public issues</b> (an unemployment rate of 10%). It connects <b>biography</b> with <b>history</b>. <b>Peter Berger</b> described the same habit as “seeing the general in the particular.”</p>
<div class="ex">One person losing a job may be bad luck. Millions losing jobs in a recession is a public issue rooted in the economy — that is the sociological imagination at work.</div>

<h3>Why sociology was born</h3>
<p>Sociology emerged in 19th-century Europe as a <b>response to upheaval</b>: the <b>Industrial Revolution</b> pulled people from farms into factories, cities grew fast (<b>urbanization</b>), and the <b>French Revolution</b> overturned old political and religious authority. Thinkers wanted to explain two things: what holds society together (<b>order</b>) and why societies transform (<b>change</b>).</p>

<h3>The founders</h3>
<p><b>Auguste Comte</b> (French, 1798–1857) <b>coined the word “sociology”</b> and is often called its founder. He promoted <b>positivism</b>: society should be studied with the same scientific methods as the natural world — observation, comparison, experiment. His <b>law of three stages</b> says human thought moves from <b>theological</b> (explaining events by gods) to <b>metaphysical</b> (abstract forces) to <b>positive/scientific</b>. He split the field into <b>social statics</b> (order) and <b>social dynamics</b> (change).</p>
<p><b>Harriet Martineau</b> (English, 1802–1876) <b>translated Comte's work into English</b>, wrote <i>Society in America</i>, and wrote one of the first books on research method (<i>How to Observe Morals and Manners</i>). She is often called the first woman sociologist.</p>
<p><b>Herbert Spencer</b> (English, 1820–1903) compared society to a living <b>organism</b> whose parts work together, and applied evolution to society. He coined the phrase <b>“survival of the fittest”</b> — the root of <b>social Darwinism</b>, the idea that inequality reflects natural fitness and that government should not help the poor. Sociologists today reject social Darwinism, but his organism analogy fed functionalism.</p>
<p><b>Karl Marx</b> (German, 1818–1883) saw history as a story of <b>class conflict</b>. Under capitalism, the <b>bourgeoisie</b> (capitalists) own the <b>means of production</b> (factories, land, tools) and the <b>proletariat</b> (workers) must sell their labor. Workers suffer <b>alienation</b> — they are cut off from the product of their labor, the work process, other people, and their own human potential. Workers who accept the system that exploits them have <b>false consciousness</b>; once they recognize their shared interests they gain <b>class consciousness</b> and, Marx predicted, revolt. His <b>economic determinism</b> (historical materialism) says the economy is the <b>base</b> that shapes the <b>superstructure</b> (law, religion, politics). He wrote <i>The Communist Manifesto</i> (1848) with Friedrich Engels and <i>Das Kapital</i>.</p>
<p><b>Émile Durkheim</b> (French, 1858–1917) made sociology an academic discipline (he founded one of the first European sociology departments at Bordeaux in 1895). He argued sociology studies <b>social facts</b> — patterns such as laws, customs, and rates that exist outside individuals and <b>constrain</b> them. In <i>The Division of Labor in Society</i> (1893) he contrasted <b>mechanical solidarity</b> (traditional societies held together by sameness — people do similar work and share beliefs) with <b>organic solidarity</b> (modern societies held together by <b>interdependence</b> — specialized workers need each other). Rapid change can produce <b>anomie</b>, a state of normlessness where rules no longer guide behavior.</p>
<p>In <i>Suicide</i> (1897) Durkheim showed that even the most personal act follows social patterns. Suicide rates depend on <b>integration</b> (how tied you are to groups) and <b>regulation</b> (how much norms control you):</p>
<ul>
<li><b>Egoistic</b> — too little integration (e.g., isolated individuals; Protestants had higher rates than Catholics, whose church bound them more tightly).</li>
<li><b>Altruistic</b> — too much integration (sacrificing oneself for the group, e.g., soldiers).</li>
<li><b>Anomic</b> — too little regulation (sudden economic crash or sudden wealth).</li>
<li><b>Fatalistic</b> — too much regulation (prisoners, slaves with no hope).</li>
</ul>
<p>In <i>The Elementary Forms of Religious Life</i> (1912) he divided the world into the <b>sacred</b> and the <b>profane</b> (see Unit 10).</p>
<p><b>Max Weber</b> (German, 1864–1920; pronounced “VAY-ber”) said sociology must grasp the meaning people attach to their actions — <b>verstehen</b> (“understanding”). In <i>The Protestant Ethic and the Spirit of Capitalism</i> (1904–05) he argued that <b>ideas can drive economic change</b>: Calvinist belief in predestination pushed believers toward disciplined work and saving, which helped capitalism grow — a direct answer to Marx's economic determinism. He described modern life as increasingly governed by <b>rationalization</b> (efficiency, calculation, rules), seen most clearly in <b>bureaucracy</b>, and warned of an “<b>iron cage</b>.” He used <b>ideal types</b> — pure, exaggerated models used for comparison — and insisted research be <b>value-free</b>: personal values should not bias how data are collected and interpreted. He also defined three types of authority and the three dimensions of stratification: class, status, and party (Units 7 and 11).</p>
<p><b>Georg Simmel</b> (German, 1858–1918) studied the <b>forms</b> of interaction regardless of content. He noticed that a <b>dyad</b> (two people) is intimate but fragile, while a <b>triad</b> (three) is more stable but allows coalitions and mediators. He also wrote about <b>the stranger</b> and about how city life makes people reserved and blasé.</p>

<h3>Sociology in the United States</h3>
<p>The first U.S. sociology department opened at the <b>University of Chicago</b> in 1892. The <b>Chicago School</b> treated the city as a laboratory, studying neighborhoods, immigrants, and crime (Robert <b>Park</b> and Ernest <b>Burgess</b> — see Unit 12).</p>
<p><b>W.E.B. Du Bois</b> (1868–1963), the first African American to earn a Harvard Ph.D., wrote <i>The Philadelphia Negro</i> (1899), an early empirical community study, and in <i>The Souls of Black Folk</i> (1903) described <b>double consciousness</b>: Black Americans seeing themselves both through their own eyes and through the eyes of a society that looks down on them. He helped found the NAACP.</p>
<p><b>Jane Addams</b> co-founded <b>Hull House</b> (1889), a Chicago settlement house that served immigrants and gathered data on urban poverty. She won the Nobel Peace Prize in 1931.</p>
<p><b>W.I. Thomas</b> stated the <b>Thomas theorem</b>: “If men define situations as real, they are real in their consequences.” Beliefs, even false ones, shape behavior.</p>

<h3>The three major perspectives</h3>
<p><b>Macro-level</b> analysis looks at large structures (the economy, social class); <b>micro-level</b> analysis looks at face-to-face interaction. The three classic theories split along that line.</p>
<p><b>1. Structural functionalism</b> (macro). Society is a system of interrelated parts (institutions) that each serve a <b>function</b> and keep the whole stable — like organs in a body. Society rests on <b>consensus</b> about values. Roots: Spencer and Durkheim. <b>Talcott Parsons</b> made it the dominant U.S. theory in the 1940s–50s. <b>Robert K. Merton</b> refined it: <b>manifest functions</b> are intended and recognized; <b>latent functions</b> are unintended and often unnoticed; <b>dysfunctions</b> are consequences that disrupt the system. He also favored <b>middle-range theories</b> that can be tested. Critics say functionalism justifies the status quo and struggles to explain conflict and change.</p>
<div class="ex">The manifest function of college is education. Latent functions: meeting a spouse, keeping young adults out of the job market. A dysfunction: student debt.</div>
<p><b>2. Conflict theory</b> (macro). Society is an arena of <b>inequality</b> in which groups compete for <b>scarce resources</b> — wealth, power, prestige — and those on top use institutions to protect their advantage. Change comes from conflict. Roots: Marx. Later conflict theorists: <b>C. Wright Mills</b> (the <b>power elite</b>), <b>Ralf Dahrendorf</b> (conflict over authority, not just ownership), <b>Lewis Coser</b> (conflict can strengthen group unity), <b>Randall Collins</b>. <b>Feminist theory</b> applies a conflict lens to gender inequality. Critics say it overlooks consensus and stability.</p>
<p><b>3. Symbolic interactionism</b> (micro). People act toward things based on the <b>meanings</b> those things have, and meanings are created and changed in <b>interaction</b> through <b>symbols</b> such as language and gestures. Roots: <b>George Herbert Mead</b> (the self, Unit 3) and <b>Charles Horton Cooley</b> (the looking-glass self). <b>Herbert Blumer</b>, Mead's student, coined the term “symbolic interactionism.” <b>Erving Goffman</b>'s <b>dramaturgy</b> treats life as theater: we manage impressions on a <b>front stage</b> and relax <b>backstage</b> (<i>The Presentation of Self in Everyday Life</i>, 1959). Critics say it neglects large structures like class.</p>

<h3>Other approaches you should recognize</h3>
<ul>
<li><b>Social exchange / rational choice theory</b> (<b>George Homans</b>, <b>Peter Blau</b>): people weigh costs and rewards in relationships.</li>
<li><b>Ethnomethodology</b> (<b>Harold Garfinkel</b>): studies the taken-for-granted rules of everyday life, often by <b>breaching experiments</b> that break a rule (e.g., bargaining over the price of groceries) to reveal it.</li>
<li><b>Feminist theory</b>: gender as a central axis of inequality and power.</li>
</ul>
<div class="ex">Look at sports through each lens. Functionalist: sports build teamwork and shared identity. Conflict: team owners profit while athletes and taxpayers bear the costs. Interactionist: what a jersey or a handshake means to fans.</div>

lesson:`
<h3>Why method matters</h3>
<p>Common sense often contradicts itself (“opposites attract” vs. “birds of a feather flock together”). Sociology replaces hunches with <b>empirical evidence</b> — information gathered through systematic observation. Because the exam asks how sociological findings are established, method questions appear throughout the test.</p>

<h3>The research process</h3>
<ol>
<li><b>Define the problem</b> and turn ideas into measurable <b>concepts</b>.</li>
<li><b>Review the literature</b> — what have others found?</li>
<li><b>Form a hypothesis</b>: a testable statement of the expected relationship between variables.</li>
<li><b>Choose a research design</b> (survey, experiment, observation, existing sources).</li>
<li><b>Collect and analyze data</b>.</li>
<li><b>Draw conclusions</b> and share results so others can <b>replicate</b> (repeat) the study.</li>
</ol>

<h3>Variables and measurement</h3>
<p>A <b>variable</b> is a concept whose value changes from case to case (income, age, education). The <b>independent variable</b> is the presumed <b>cause</b>; the <b>dependent variable</b> is the <b>effect</b>.</p>
<div class="ex">Hypothesis: “More years of education lead to higher income.” Education is the independent variable; income is the dependent variable.</div>
<p>An <b>operational definition</b> spells out exactly how a concept is measured — “religiosity” might be operationalized as “number of religious services attended per month.”</p>
<p>Good measures are <b>reliable</b> and <b>valid</b>. <b>Reliability</b> means consistency: repeated measurement gives the same result. <b>Validity</b> means accuracy: the measure captures what it claims to. A bathroom scale that always reads 5 pounds light is reliable but not valid. Using church attendance to measure faith may be reliable but of questionable validity, since some believers rarely attend.</p>

<h3>Correlation and causation</h3>
<p>A <b>correlation</b> exists when two variables change together. In a <b>positive</b> (direct) correlation both rise together (education and income). In a <b>negative</b> (inverse) correlation one rises as the other falls (education and the chance of being unemployed).</p>
<p><b>Correlation does not prove causation.</b> To claim cause, researchers need three things: (1) the variables are correlated, (2) the cause comes <b>before</b> the effect (time order), and (3) the relationship is not <b>spurious</b> — produced by a third variable. Researchers add <b>control variables</b> to rule out such third factors.</p>
<div class="ex">Ice cream sales and drownings rise together. Ice cream does not cause drowning — hot weather (a third variable) increases both. The correlation is spurious.</div>

<h3>Populations and samples</h3>
<p>The <b>population</b> is everyone the researcher wants to learn about; a <b>sample</b> is the subset actually studied. In a <b>random sample</b>, every member of the population has an <b>equal chance</b> of being selected, so the sample tends to be <b>representative</b> and results can be <b>generalized</b>. A <b>stratified random sample</b> divides the population into subgroups (e.g., by race or region) and samples each in proportion. <b>Convenience samples</b> (whoever is handy) and <b>snowball samples</b> (subjects recruit others — useful for hidden groups like drug users) are easier but not representative.</p>
<div class="ex">An online poll of a news site's readers is a convenience sample of <b>self-selected</b> volunteers: its results describe that site's most motivated readers, not all Americans.</div>

<h3>The four main research designs</h3>
<p><b>1. Surveys</b> ask people questions through <b>questionnaires</b> (self-administered) or <b>interviews</b> (in person or by phone). <b>Closed-ended</b> questions offer fixed choices and are easy to tabulate; <b>open-ended</b> questions let people answer freely, giving richer but harder-to-code data. Surveys are the most widely used method and are ideal for measuring <b>attitudes and behaviors of large populations</b>. Weaknesses: people may misremember, or give answers that make them look good — <b>social desirability bias</b> (overreporting voting, underreporting drinking); question wording can bias results.</p>
<p><b>2. Experiments</b> test cause and effect under controlled conditions. Subjects are randomly assigned to an <b>experimental group</b>, which is exposed to the independent variable, and a <b>control group</b>, which is not. Researchers compare the dependent variable before (<b>pretest</b>) and after (<b>posttest</b>). Experiments are the strongest design for <b>establishing causation</b>, but lab settings are artificial and many social questions cannot ethically be tested. The <b>Hawthorne effect</b> — named for studies at Western Electric's Hawthorne plant in the 1920s–30s — is the tendency of subjects to change their behavior simply because they know they are being watched.</p>
<p><b>3. Field research / participant observation</b>: the researcher joins a group's everyday life to observe it from the inside. An in-depth study of a culture or group is an <b>ethnography</b>; an in-depth study of one person, group, or event is a <b>case study</b>. William Foote Whyte's <i>Street Corner Society</i> (1943) is a classic. Strength: rich, <b>qualitative</b> understanding of real behavior in natural settings. Weaknesses: small, unrepresentative samples, hard to replicate, and the observer may influence the group or lose objectivity (“going native”).</p>
<p><b>4. Existing sources / secondary analysis</b>: analyzing data someone else collected — census figures, government statistics, historical records. <b>Content analysis</b> systematically counts themes in media or documents (e.g., how often women appear as experts in TV news). Durkheim's <i>Suicide</i> used official statistics. These are <b>unobtrusive</b> (subjects are not disturbed) and cheap, but the data were gathered for other purposes and may not fit the question.</p>
<p>Using several methods to check one another is called <b>triangulation</b>. <b>Quantitative</b> research works with numbers and statistics (surveys, secondary data); <b>qualitative</b> research works with words, observations, and meanings (participant observation, open interviews).</p>
<p>Studies also differ in time frame: a <b>cross-sectional</b> study is a one-time snapshot; a <b>longitudinal</b> study follows the same people over a long period, which is better for tracking change.</p>

<h3>Reading the numbers</h3>
<p>Three measures of <b>central tendency</b>:</p>
<ul>
<li><b>Mean</b> — the arithmetic average. Sensitive to extreme values (outliers).</li>
<li><b>Median</b> — the middle value when cases are ranked. Not pulled by outliers, so it is preferred for skewed data such as income or home prices.</li>
<li><b>Mode</b> — the most frequent value.</li>
</ul>
<div class="ex">Incomes of $30k, $35k, $40k, $45k and $1,000k: the mean is $230k, but the median is $40k — a far better picture of the typical person.</div>
<p>Rates allow comparisons between groups of different sizes: a crime rate or birth rate is usually expressed per 1,000 or 100,000 people. When reading a table, check the title, the units (percent? per 1,000?), and which way the percentages add up before drawing conclusions.</p>

<h3>Reading tables and charts</h3>
<p>The exam includes questions that ask you to interpret a short table or graph. Work through four steps:</p>
<ol>
<li><b>Read the title and labels first.</b> What population is described, and what year? Are the numbers <b>counts</b> (how many), <b>percentages</b> (out of 100), or <b>rates</b> (per 1,000 or per 100,000)?</li>
<li><b>Check which way the percentages add up.</b> If each row sums to 100%, compare across a row; if each column sums to 100%, compare down a column.</li>
<li><b>Compare like with like.</b> Raw counts mislead when groups differ in size. A city of 2 million with 400 robberies has a <i>lower</i> robbery rate (20 per 100,000) than a town of 200,000 with 100 robberies (50 per 100,000).</li>
<li><b>Stick to what the data show.</b> A table can show that two variables are <b>associated</b>; it cannot by itself show that one <b>causes</b> the other. Wrong answer choices often overreach (“proves that…”), describe a different group than the table covers, or confuse a part with the whole.</li>
</ol>
<div class="ex">A table shows 65% of college graduates support a policy compared with 40% of people with a high school education. You may conclude support is positively associated with education. You may not conclude that “65% of adults support it” or that a degree causes support.</div>

<h3>Ethics and objectivity</h3>
<p>The American Sociological Association's code of ethics requires <b>informed consent</b> (subjects know the risks and agree to participate), <b>protection from harm</b>, and <b>confidentiality</b> (researchers know identities but do not reveal them) or <b>anonymity</b> (even researchers do not know who answered). Universities use <b>Institutional Review Boards (IRBs)</b> to approve research involving human subjects.</p>
<p>Famous controversies: Laud Humphreys' <i>Tearoom Trade</i> (1970) observed secret sexual encounters between men and later traced and interviewed them without consent; <b>Stanley Milgram</b>'s obedience experiments caused participants serious stress; <b>Philip Zimbardo</b>'s Stanford prison experiment (1971) was halted after “guards” abused “prisoners.”</p>
<p>Weber's ideal of <b>value-free</b> (value-neutral) research and the practice of <b>replication</b> help keep personal bias out of findings.</p>

lesson:`
<h3>What culture is</h3>
<p><b>Culture</b> is the whole way of life a group shares and passes on: its objects, ideas, values, and behaviors. <b>Material culture</b> is the physical things people make (smartphones, churches, clothing). <b>Nonmaterial (symbolic) culture</b> is the ideas behind them (beliefs, values, norms, language). A <b>society</b> is the people who share a culture and territory.</p>
<p>Culture is learned, not inherited. <b>Sociobiology</b> (E.O. Wilson) argues that some behaviors have evolutionary roots, but most sociologists stress learning — the <b>nurture</b> side of the nature/nurture debate.</p>

<h3>The building blocks</h3>
<p><b>Symbols</b> are anything that carries a shared meaning — a flag, a wink, a word. <b>Language</b> is the most important symbol system. The <b>Sapir–Whorf hypothesis</b> (linguistic relativity) holds that language does not just describe reality but <b>shapes how we perceive</b> it.</p>
<p><b>Values</b> are broad ideas about what is good and desirable (freedom, achievement). <b>Beliefs</b> are specific statements people hold to be true. <b>Norms</b> are rules for behavior. William Graham <b>Sumner</b> (<i>Folkways</i>, 1906) ranked them by how seriously they are taken:</p>
<ul>
<li><b>Folkways</b> — everyday customs (shaking hands, not wearing pajamas to work). Violators seem odd, not evil.</li>
<li><b>Mores</b> (MOR-ays) — norms with strong moral weight (do not steal, do not abuse children). Violations bring outrage and punishment.</li>
<li><b>Taboos</b> — mores so strong that the act is unthinkable (incest, cannibalism).</li>
<li><b>Laws</b> — norms formally written down and enforced by the state. A law can codify a more (murder) or a minor matter (parking rules).</li>
</ul>
<p>Norms are enforced by <b>sanctions</b>: rewards (positive) or penalties (negative), applied <b>formally</b> (a fine, a diploma) or <b>informally</b> (a frown, a compliment). Every culture also has a gap between <b>ideal culture</b> (what people say they value) and <b>real culture</b> (what they actually do).</p>

<h3>Cultural variation</h3>
<p>Despite enormous diversity, anthropologist George <b>Murdock</b> identified <b>cultural universals</b> found in every society: family, religion, language, funeral rites, sports, and more. Their specific forms vary widely.</p>
<p><b>Ethnocentrism</b> (Sumner's term) is judging other cultures by the standards of one's own, usually assuming one's own is superior. <b>Cultural relativism</b> is the scientific stance of understanding a practice within its own cultural context. <b>Xenocentrism</b> is the reverse of ethnocentrism: believing another culture's products or ways are superior. <b>Culture shock</b> is the disorientation people feel when immersed in an unfamiliar culture.</p>
<div class="ex">A tourist who calls a market selling fried insects “disgusting and backward” is ethnocentric. A researcher who asks what role insects play in the local diet and economy is practicing cultural relativism.</div>
<p>The <b>dominant culture</b> holds the most power. A <b>subculture</b> shares most mainstream values but has its own distinct norms, slang, or style (skateboarders, a military unit, an immigrant community). A <b>counterculture</b> actively <b>rejects</b> mainstream values (1960s hippies, violent militia groups). <b>Multiculturalism</b> values the many cultures within a society.</p>

<h3>How culture changes</h3>
<p>Culture changes through <b>discovery</b> (finding something that exists), <b>invention</b> (combining elements into something new — the car, the internet), and <b>diffusion</b> (spread from one culture to another — sushi in Ohio). William <b>Ogburn</b>'s <b>cultural lag</b> describes the delay when <b>nonmaterial culture</b> fails to keep up with <b>material/technological</b> change.</p>
<div class="ex">Smartphones can track a person's location every minute, but privacy laws written decades earlier have not caught up — cultural lag.</div>

<h3>Socialization: becoming human</h3>
<p><b>Socialization</b> is the lifelong process by which people learn their culture and develop a <b>self</b>. Evidence that it is essential:</p>
<ul>
<li><b>Isolated children</b>: Kingsley Davis studied <b>Anna</b> and <b>Isabelle</b>, girls kept hidden with little contact. Anna never developed normally; Isabelle, who had contact with her deaf-mute mother and later intensive training, caught up. <b>Genie</b>, discovered in 1970 at age 13, never fully acquired language.</li>
<li><b>Harry Harlow</b>'s rhesus monkeys, raised in isolation, became fearful and unable to interact. Infant monkeys preferred a soft cloth “mother” over a wire one that provided milk — <b>contact comfort</b> matters more than food.</li>
</ul>

<h3>Theories of the self</h3>
<p><b>Charles Horton Cooley</b>: the <b>looking-glass self</b>. We (1) imagine how we appear to others, (2) imagine their judgment, and (3) develop feelings about ourselves (pride or shame) from that imagined judgment. Our self-image may not match how others actually see us. Cooley also named <b>primary groups</b> (Unit 4).</p>
<p><b>George Herbert Mead</b>: the self emerges through <b>social interaction</b> and <b>role-taking</b>. It has two parts: the <b>“I”</b> (spontaneous, creative, acting) and the <b>“me”</b> (the socialized self that sees itself as others do). Children develop in stages:</p>
<ol>
<li><b>Imitation / preparatory stage</b> — mimicking without understanding.</li>
<li><b>Play stage</b> — pretending to be <b>significant others</b> (“I'm Mommy”).</li>
<li><b>Game stage</b> — understanding many roles at once and the rules of the whole group: the <b>generalized other</b>, society's general expectations.</li>
</ol>
<div class="ex">A child playing shortstop must anticipate what the pitcher, batter, and first baseman will all do. Mead used exactly this kind of game to illustrate the generalized other.</div>
<p><b>Sigmund Freud</b>: personality has three parts: the <b>id</b> (biological drives, pleasure), the <b>superego</b> (internalized cultural rules — conscience), and the <b>ego</b> (balances the two against reality).</p>
<p><b>Jean Piaget</b>: cognitive development in four stages — <b>sensorimotor</b> (birth–2, learning through senses), <b>preoperational</b> (2–7, symbols and language), <b>concrete operational</b> (7–11, logic about concrete events), <b>formal operational</b> (12+, abstract thinking).</p>
<p><b>Lawrence Kohlberg</b>: moral reasoning develops from <b>preconventional</b> (avoid punishment, get rewards) to <b>conventional</b> (follow society's rules) to <b>postconventional</b> (abstract principles of justice). <b>Carol Gilligan</b> criticized Kohlberg for studying mostly boys; she found girls more often reason with a <b>care and responsibility</b> perspective, boys with a <b>justice and rules</b> perspective.</p>
<p><b>Erik Erikson</b> described <b>eight stages across the whole life span</b>, each with a challenge (trust vs. mistrust in infancy; <b>identity vs. role confusion</b> in adolescence; integrity vs. despair in old age).</p>

<h3>Agents of socialization</h3>
<ul>
<li><b>Family</b> — the most important agent, especially in early childhood; passes on language, values, religion, and social class position.</li>
<li><b>School</b> — teaches academic skills plus a <b>hidden curriculum</b>: punctuality, obedience, competition.</li>
<li><b>Peer group</b> — people of similar age and status; increasingly influential in adolescence.</li>
<li><b>Mass media</b> — television, internet, and social media shape attitudes and gender images.</li>
<li><b>Workplace</b> and <b>religion</b> continue socialization in adulthood.</li>
</ul>
<p><b>Anticipatory socialization</b> is learning the norms of a role before you occupy it (a high school senior visiting colleges and adopting campus style). <b>Resocialization</b> is discarding old norms and learning new ones, often deliberately. It is most intense in a <b>total institution</b> (Erving Goffman, <i>Asylums</i>, 1961) — a setting where people are cut off from society and controlled by one authority: prisons, boot camps, psychiatric hospitals, cloistered religious orders. Entry often begins with a <b>degradation ceremony</b> (Harold Garfinkel's term) that strips away the old identity — uniforms, shaved heads, numbers instead of names.</p>
`,

lesson:`
<h3>Social structure: statuses and roles</h3>
<p><b>Social structure</b> is the stable framework of relationships that guides interaction. Its basic units are statuses and roles.</p>
<p>A <b>status</b> is a recognized social position. An <b>ascribed status</b> is assigned at birth or involuntarily later in life (sex, race, age, being someone's daughter). An <b>achieved status</b> is earned or chosen (college graduate, nurse, ex-convict). All the statuses a person holds make up a <b>status set</b>. A <b>master status</b> dominates others and shapes how people see you — a serious disability, a famous name, or a criminal record can overshadow everything else.</p>
<p>A <b>role</b> is the behavior expected of someone in a status: you <i>occupy</i> a status but <i>play</i> a role. One status carries a <b>role set</b> (a student relates to professors, classmates, and advisers). <b>Role conflict</b> is a clash between roles of <b>different</b> statuses (a parent's child is sick on the day the employee has a key meeting). <b>Role strain</b> is tension among demands within <b>one</b> status (a manager who must be friendly with employees and also discipline them). <b>Role exit</b> is the process of leaving a role that was central to one's identity (retirement, divorce, leaving a religious order).</p>

<h3>Interaction: building reality together</h3>
<p>Peter <b>Berger</b> and Thomas <b>Luckmann</b>'s <i>The Social Construction of Reality</i> (1966) argues that what people treat as “real” is created and maintained through interaction. The <b>Thomas theorem</b> (Unit 1) makes a similar point. <b>Ethnomethodology</b> (Garfinkel) studies the unspoken rules we use to make sense of everyday encounters, and <b>dramaturgy</b> (Goffman) studies <b>impression management</b> — how we present ourselves to others on the front stage.</p>

<h3>Types of societies</h3>
<p>Gerhard <b>Lenski</b> classified societies by their technology: <b>hunting and gathering</b> (small, nomadic, little inequality) → <b>horticultural and pastoral</b> (simple farming, herding) → <b>agrarian</b> (plows, large surpluses, sharp inequality) → <b>industrial</b> (machines and factories) → <b>postindustrial</b> (information and services). More technology generally brings more surplus and specialization.</p>

<h3>Groups</h3>
<p>A <b>group</b> is two or more people who interact and share a sense of identity. A <b>category</b> (all left-handed people) or an <b>aggregate</b> (people waiting at a bus stop) is not a group.</p>
<ul>
<li><b>Primary groups</b> (Charles Horton <b>Cooley</b>): small, intimate, long-lasting, valued for themselves — family, close friends. They are the main source of identity.</li>
<li><b>Secondary groups</b>: larger, impersonal, temporary, organized around a goal — a college class, a corporation.</li>
<li><b>In-groups</b> command loyalty; <b>out-groups</b> are viewed with competition or hostility (William Graham <b>Sumner</b>).</li>
<li>A <b>reference group</b> is a group whose standards we use to evaluate ourselves, whether or not we belong to it.</li>
</ul>
<p><b>Group size</b> matters (Georg <b>Simmel</b>). A <b>dyad</b> (two people) is the most intimate but also the most fragile — it ends if one person leaves. A <b>triad</b> (three) is more stable because a third person can mediate, but two members can form a <b>coalition</b> against the third.</p>
<p>Groups have two kinds of leaders: <b>instrumental</b> leaders focus on getting the task done; <b>expressive</b> leaders focus on morale and harmony. Kurt Lewin described three leadership styles: <b>authoritarian</b>, <b>democratic</b>, and <b>laissez-faire</b>.</p>
<p><b>Social networks</b> link people through ties. Mark Granovetter's “strength of <b>weak ties</b>” shows that acquaintances are often more useful than close friends for finding jobs, because they connect us to new information.</p>

<h3>Conformity and obedience</h3>
<ul>
<li><b>Solomon Asch</b> (1950s): subjects judging which line matched a standard line often went along with confederates who unanimously gave an obviously wrong answer — about a third of answers conformed.</li>
<li><b>Stanley Milgram</b> (1960s): most subjects obeyed an experimenter's orders to give what they believed were dangerous electric shocks to another person — the power of <b>obedience to authority</b>.</li>
<li><b>Irving Janis</b>: <b>groupthink</b> — highly cohesive decision-making groups suppress doubts and alternatives to keep consensus, producing poor decisions (the Bay of Pigs invasion is his classic case).</li>
</ul>

<h3>Formal organizations and bureaucracy</h3>
<p>A <b>formal organization</b> is a large secondary group built to achieve goals efficiently. Amitai <b>Etzioni</b> identified three types by why people join:</p>
<ul>
<li><b>Normative</b> (voluntary) — to pursue goals they consider worthwhile (the Red Cross, a church, the PTA).</li>
<li><b>Coercive</b> — membership is forced (prisons, psychiatric hospitals).</li>
<li><b>Utilitarian</b> — for material reward (a job, a college degree).</li>
</ul>
<p>Max <b>Weber</b> saw <b>bureaucracy</b> as the most rational, efficient form of organization. His <b>ideal type</b> has: (1) a <b>division of labor</b> with specialized tasks; (2) a <b>hierarchy of authority</b>; (3) <b>written rules and regulations</b>; (4) <b>impersonality</b> — treating cases and people by rules, not feelings; (5) employment and promotion based on <b>technical qualifications</b>. Real organizations also have an <b>informal structure</b> — friendships and shortcuts that bend the official rules.</p>
<p>Bureaucracy has well-known problems:</p>
<ul>
<li><b>Bureaucratic ritualism / goal displacement</b> (Robert Merton): following rules becomes more important than the goal they were meant to serve.</li>
<li><b>Iron law of oligarchy</b> (Robert <b>Michels</b>): even democratic organizations come to be ruled by a small, self-perpetuating elite.</li>
<li><b>Peter principle</b> (Laurence Peter): people are promoted until they reach their level of incompetence.</li>
<li><b>Parkinson's law</b>: work expands to fill the time available.</li>
<li><b>McDonaldization</b> (George <b>Ritzer</b>): the principles of the fast-food restaurant — <b>efficiency</b>, <b>calculability</b> (quantity over quality), <b>predictability</b>, and <b>control</b> (often through technology) — spread through society, with the dehumanizing effects Weber called the “iron cage.”</li>
</ul>
<div class="ex">A clerk refuses to process an urgent application because one box was filled in blue ink instead of black. The rule has displaced the goal of serving the public — bureaucratic ritualism.</div>
`,

lesson:`
<h3>What counts as deviance</h3>
<p><b>Deviance</b> is behavior that violates a group's norms. It is <b>relative</b>: the same act may be deviant in one time, place, or group and normal in another (tattoos, drinking alcohol, cohabitation). <b>Crime</b> is deviance that violates formal law. <b>Social control</b> is the set of means a society uses to encourage conformity — <b>informal</b> (gossip, praise, shunning) and <b>formal</b> (police, courts, prisons).</p>
<p>Erving Goffman's <b>stigma</b> is a powerfully negative label or mark that spoils a person's identity — a prison record, a visible disability — and can become a master status.</p>

<h3>Early explanations</h3>
<p>Cesare <b>Lombroso</b> (1800s) claimed criminals could be identified by “primitive” physical features; William Sheldon linked crime to body type. These <b>biological</b> theories have been discredited. Sociologists look instead for social causes.</p>

<h3>Functionalist explanations</h3>
<p><b>Émile Durkheim</b> argued that deviance is <b>normal</b> — found in every society — and <b>functional</b>. Responding to deviance (1) <b>affirms cultural values and norms</b>, (2) <b>clarifies moral boundaries</b> between right and wrong, (3) <b>promotes social unity</b> as people join together against the offender, and (4) can <b>encourage social change</b> by pushing boundaries (civil rights protesters were once deviants).</p>
<p><b>Robert Merton</b>'s <b>strain theory</b>: American culture holds out a <b>goal</b> (financial success) but not everyone has access to the legitimate <b>means</b> (education, good jobs). The strain produces five adaptations:</p>
<ul>
<li><b>Conformity</b> — accept goals and means (most people).</li>
<li><b>Innovation</b> — accept the goal, reject legitimate means (drug dealers, embezzlers, a student who cheats for an A).</li>
<li><b>Ritualism</b> — abandon the goal but rigidly follow the rules (a bureaucrat going through the motions with no hope of advancement).</li>
<li><b>Retreatism</b> — reject both goals and means and drop out (some chronic drug users, people living as hermits).</li>
<li><b>Rebellion</b> — reject both and substitute new goals and means (revolutionaries, radical cults).</li>
</ul>
<p>Richard <b>Cloward and Lloyd Ohlin</b> added that people also need access to <b>illegitimate opportunity structures</b>; where organized crime exists, young people can learn criminal careers (differential opportunity theory). Albert Cohen described <b>delinquent subcultures</b> that reward status among lower-class boys blocked from middle-class success.</p>

<h3>Symbolic interactionist explanations</h3>
<p><b>Differential association</b> (Edwin <b>Sutherland</b>): deviance is <b>learned</b>, like any behavior, through interaction in intimate groups. People become deviant when they are exposed to more definitions <b>favorable</b> to breaking the law than unfavorable ones.</p>
<p><b>Labeling theory</b>: Howard <b>Becker</b> (<i>Outsiders</i>, 1963) wrote that deviance is not a quality of the act but of the response — “deviant behavior is behavior that people so label.” Edwin <b>Lemert</b> distinguished <b>primary deviance</b> (minor, passing violations that do not affect self-image) from <b>secondary deviance</b> (repeated deviance that follows when a person is labeled and accepts the deviant identity). William Chambliss's “<b>Saints and the Roughnecks</b>” showed that middle-class boys who misbehaved as much as working-class boys escaped the delinquent label, while the working-class boys were labeled and lived up to it. David Rosenhan's study of sane people admitted to mental hospitals showed how a label (“schizophrenic”) colors how all later behavior is interpreted.</p>
<p><b>Control theory</b> asks why people <i>don't</i> deviate. Travis <b>Hirschi</b>'s <b>social bond theory</b>: people with strong bonds conform. The four bonds are <b>attachment</b> (to family, friends), <b>commitment</b> (stakes in conformity, such as a career), <b>involvement</b> (busy with legitimate activities), and <b>belief</b> (in the moral validity of rules). Walter Reckless's <b>containment theory</b> stresses inner and outer controls.</p>
<p>Gresham Sykes and David Matza's <b>techniques of neutralization</b> explain how offenders excuse their acts: denying responsibility, denying injury (“nobody got hurt”), denying the victim (“he deserved it”), condemning the condemners, and appealing to higher loyalties.</p>
<p><b>Medicalization of deviance</b> redefines moral problems as medical conditions — alcoholism or hyperactivity once treated as moral failure are now diagnoses.</p>

<h3>Conflict explanations</h3>
<p>Conflict theorists argue that <b>laws reflect the interests of the powerful</b> (Richard Quinney). The poor are more likely to be arrested and imprisoned for street crimes, while the harmful acts of the rich are treated leniently. Sutherland coined <b>white-collar crime</b> (1939) for crimes committed by respectable, high-status people in the course of their work — embezzlement, fraud, insider trading. <b>Corporate crime</b> is illegal action by a company. Both cost far more money than street crime but bring lighter punishment.</p>

<h3>Measuring crime</h3>
<ul>
<li>The FBI's <b>Uniform Crime Reports (UCR)</b>, now the <b>National Incident-Based Reporting System (NIBRS)</b>, compile crimes <b>known to police</b>.</li>
<li>The <b>National Crime Victimization Survey (NCVS)</b> asks households whether they were victims. It finds much more crime than police records, because <b>many crimes are never reported</b> — the “dark figure” of crime.</li>
</ul>
<p>Types of crime include <b>violent</b> crimes (murder, assault, rape, robbery), <b>property</b> crimes (burglary, theft, arson), <b>victimless crimes</b> (illegal drug use, gambling, prostitution — willing participants), <b>organized crime</b>, <b>hate crimes</b>, and white-collar crime. Arrest data show crime is committed disproportionately by young males.</p>

<h3>Punishment</h3>
<p>Four justifications: <b>retribution</b> (making offenders pay — the oldest), <b>deterrence</b> (discouraging crime by fear of punishment, for the offender (specific) or everyone (general)), <b>rehabilitation</b> (reforming the offender), and <b>societal protection</b> (incapacitating the offender through prison or death). High <b>recidivism</b> — repeat offending after release — suggests prisons rehabilitate poorly. The “<b>broken windows</b>” theory (Wilson and Kelling) holds that tolerating small disorders invites serious crime.</p>

lesson:`
<h3>Collective behavior</h3>
<p><b>Collective behavior</b> is relatively spontaneous, short-lived, and unstructured activity by a large number of people, often outside ordinary norms. It contrasts with <b>institutionalized</b> behavior like attending a scheduled class.</p>
<p><b>Crowds</b> are temporary gatherings sharing a focus. Herbert <b>Blumer</b> named four types: <b>casual</b> (onlookers at an accident), <b>conventional</b> (a concert audience following norms), <b>expressive</b> (people releasing emotion, as at a revival or New Year's Eve), and <b>acting</b> (aroused and goal-directed). An acting crowd can become a <b>mob</b> (focused, emotional, violent — a lynch mob) or a <b>riot</b> (undirected violence and destruction).</p>
<p>Dispersed forms of collective behavior involve people who are not in one place:</p>
<ul>
<li><b>Panic</b> — fearful, often self-defeating flight or action (a stampede, a bank run, panic buying).</li>
<li><b>Mass hysteria</b> — widespread, irrational fear spread by suggestion (the 1938 “War of the Worlds” radio broadcast is the classic example, though its scale has been exaggerated).</li>
<li><b>Rumor</b> — unverified information passed person to person; <b>urban legends</b> are rumors with a moral.</li>
<li><b>Fad</b> — a short-lived, intensely popular novelty (a viral dance challenge). <b>Fashion</b> — a socially approved style that lasts longer (clothing, architecture). A <b>craze</b> is a fad that becomes an obsession.</li>
<li><b>Moral panic</b> (Stanley Cohen) — exaggerated public fear that some group threatens society, fanned by the media.</li>
<li><b>Public opinion</b> and <b>propaganda</b> — attitudes of people concerned with an issue, and deliberate attempts to shape them.</li>
</ul>

<h3>Explaining crowds</h3>
<p><b>Contagion theory</b> — Gustave <b>Le Bon</b> (<i>The Crowd</i>, 1895): crowds have a hypnotic influence. <b>Anonymity</b> lets people shed responsibility, and emotion spreads like a disease until members act irrationally. Criticism: crowds are often more orderly and purposeful than Le Bon claimed.</p>
<p><b>Convergence theory</b>: crowds do not change people; like-minded people <b>converge</b> in a crowd. A violent crowd is violent because violent-minded people came together.</p>
<p><b>Emergent-norm theory</b> — Ralph <b>Turner</b> and Lewis <b>Killian</b>: crowds start with a mix of motives, and in an ambiguous situation new <b>norms emerge</b> (often suggested by a few “keynoters”) that then guide behavior.</p>
<p><b>Value-added theory</b> — Neil <b>Smelser</b>: collective behavior occurs only when six conditions build on one another: (1) <b>structural conduciveness</b> (the setting allows it), (2) <b>structural strain</b> (a problem or tension), (3) a <b>generalized belief</b> about the cause, (4) a <b>precipitating factor</b> (a triggering event), (5) <b>mobilization for action</b> (leaders, communication), and (6) weak <b>social control</b>.</p>
<div class="ex">Long-standing distrust of police (strain and generalized belief) plus a viral video of a violent arrest (precipitating factor) plus organizers using social media (mobilization) can produce mass protests.</div>

<h3>Social movements</h3>
<p>A <b>social movement</b> is an organized, ongoing effort by many people to bring about or resist social change. It lasts longer and is more structured than other collective behavior. David <b>Aberle</b> classified movements by <b>who</b> is to change (individuals or society) and <b>how much</b>:</p>
<ul>
<li><b>Alternative</b> — limited change in individuals (a campaign to get people to stop texting while driving).</li>
<li><b>Redemptive</b> — total change in individuals (religious conversion movements, Alcoholics Anonymous).</li>
<li><b>Reformative</b> — limited change in society (environmental, women's suffrage, civil rights).</li>
<li><b>Revolutionary</b> — total change in society (the Russian Revolution).</li>
</ul>
<p><b>Resistance</b> (reactionary) movements try to block or reverse change.</p>
<p><b>Why movements form:</b></p>
<ul>
<li><b>Relative deprivation theory</b>: people mobilize when they feel deprived <b>relative</b> to others or to their own expectations, not necessarily because they are absolutely poor. James Davies' <b>J-curve</b>: revolutions often follow a period of improvement that is suddenly reversed, so expectations outrun reality.</li>
<li><b>Resource mobilization theory</b> (McCarthy and Zald): discontent is everywhere; movements succeed when they can mobilize <b>resources</b> — money, members, leaders, organization, and media access.</li>
<li><b>Political process theory</b>: movements grow when political opportunities open up.</li>
<li><b>Framing</b>: leaders define the problem and solution in ways that resonate with potential supporters.</li>
<li><b>New social movements</b> (since the 1960s) focus on identity, quality of life, and global issues (environment, LGBTQ rights) rather than economic class.</li>
</ul>
<p><b>Life cycle</b>: <b>emergence</b> (widespread discontent) → <b>coalescence</b> (leaders, strategy, alliances) → <b>bureaucratization</b> (paid staff, formal organization) → <b>decline</b>, which can result from <b>success</b>, <b>failure</b>, <b>co-optation</b> (leaders absorbed by the establishment), <b>repression</b>, or becoming mainstream.</p>

<h3>Social change</h3>
<p><b>Social change</b> is the transformation of culture and social structure over time. Sources include <b>technology</b> (the printing press, the internet), <b>population</b> shifts, the <b>physical environment</b>, <b>ideas</b> (Weber's Protestant ethic), <b>conflict</b> (Marx's class struggle), and <b>diffusion</b> from other societies. Ogburn's <b>cultural lag</b> (Unit 3) describes uneven change.</p>
<p>Major theories:</p>
<ul>
<li><b>Evolutionary theories</b> — societies move from simple to complex. <b>Unilinear</b> versions (Comte, Spencer) say all societies follow the same path; <b>multilinear</b> versions allow different paths.</li>
<li><b>Cyclical theories</b> — civilizations rise and fall in recurring patterns: Oswald <b>Spengler</b> (<i>The Decline of the West</i>), Arnold <b>Toynbee</b> (challenge and response), and Pitirim <b>Sorokin</b> (societies swing between <b>ideational</b>, faith-based, and <b>sensate</b>, sense-based, cultures).</li>
<li><b>Functionalist / equilibrium theory</b> — Talcott <b>Parsons</b>: society adjusts to change and returns to balance.</li>
<li><b>Conflict theory</b> — Marx: change arises from struggles between groups with opposing interests.</li>
</ul>
<p><b>Modernization</b> — the shift from traditional to industrial, then postindustrial, society — brings smaller communities' decline, more diversity and individual choice, and rapid change. David <b>Riesman</b> (<i>The Lonely Crowd</i>) said people move from <b>tradition-directed</b> to <b>inner-directed</b> to <b>other-directed</b> personalities (guided by peers and media). Daniel <b>Bell</b> described the <b>postindustrial society</b>, built on information and services. Global versions of these ideas — modernization, dependency, and world-systems theory — are covered in Unit 7.</p>
`,

lesson:`
<h3>What stratification is</h3>
<p><b>Social stratification</b> is a system by which a society ranks categories of people in a hierarchy, giving them unequal access to <b>wealth, power, and prestige</b>. It is a trait of society, not just of individuals; it persists across generations; it is universal but varies in form; and it is supported by <b>beliefs</b> (ideology) that make it seem fair.</p>

<h3>Systems of stratification</h3>
<ul>
<li><b>Caste system</b> — status is <b>ascribed</b> at birth and fixed for life. It is a <b>closed system</b>: little or no mobility, <b>endogamy</b> (marriage within one's caste), and often rules on occupation and contact. Examples: traditional India, apartheid South Africa.</li>
<li><b>Class system</b> — based partly on individual achievement. It is an <b>open system</b> that allows <b>social mobility</b>, and categories blur. Example: the modern United States.</li>
<li><b>Estate system</b> — feudal Europe's nobility, clergy, and commoners, based on land and inherited rights.</li>
<li><b>Slavery</b> — some people own others as property; the most extreme inequality.</li>
</ul>
<p>A <b>meritocracy</b> ranks people purely by personal merit; no real society is a pure meritocracy.</p>

<h3>Theories of stratification</h3>
<p><b>Functionalism — the Davis–Moore thesis</b> (Kingsley Davis and Wilbert Moore, 1945): stratification is <b>universal and necessary</b>. Some positions are more important and require rare talent and long training; higher rewards motivate the best people to fill them. Melvin <b>Tumin</b> replied that importance is hard to measure (is a celebrity more important than a nurse?), that inequality blocks talented poor people, and that inherited wealth has nothing to do with merit.</p>
<p><b>Conflict — Karl Marx</b>: class is defined by one's relationship to the <b>means of production</b>. Capitalists (bourgeoisie) own them; workers (proletariat) sell their labor. Stratification benefits owners at workers' expense, and <b>ideology</b> makes it look natural.</p>
<p><b>Max Weber</b> argued stratification has <b>three separate dimensions</b>:</p>
<ul>
<li><b>Class</b> — economic position (wealth, income), which shapes <b>life chances</b> such as health, education, and life expectancy.</li>
<li><b>Status</b> — prestige or social honor.</li>
<li><b>Party</b> (power) — the ability to influence political decisions.</li>
</ul>
<p>Because the dimensions can diverge, people may experience <b>status inconsistency</b>: a wealthy drug dealer has money but low prestige; a member of the clergy may have high prestige but low income. Sociologists today combine income, education, and occupation into <b>socioeconomic status (SES)</b>, a Weberian, multidimensional measure.</p>
<p><b>Gerhard Lenski</b> linked inequality to technology: hunting-and-gathering societies are fairly equal; agrarian societies are the most unequal; industrial societies become somewhat more equal (his version of the <b>Kuznets curve</b>).</p>
<p><b>Symbolic interactionism</b> looks at how class shapes everyday life — whom we marry, how we dress. Thorstein <b>Veblen</b> (<i>The Theory of the Leisure Class</i>, 1899) coined <b>conspicuous consumption</b>: buying expensive goods to display social position.</p>

<h3>Power</h3>
<p>Weber defined <b>power</b> as the ability to achieve one's goals <b>even against others' resistance</b>. Who holds power in the U.S.?</p>
<ul>
<li><b>Power-elite model</b> — C. Wright <b>Mills</b> (<i>The Power Elite</i>, 1956): a small group of top <b>corporate, military, and political</b> leaders, linked by shared backgrounds, makes the key decisions.</li>
<li><b>Pluralist model</b> — Robert <b>Dahl</b> (<i>Who Governs?</i>): power is <b>dispersed</b> among many competing interest groups, none of which dominates.</li>
</ul>
<p>(Weber's types of <i>legitimate</i> power — authority — are in Unit 11.)</p>

<h3>Class in the United States</h3>
<p><b>Income</b> is money received (wages, interest); <b>wealth</b> is the total value of assets minus debts. Wealth is <b>far more unequally distributed</b> than income: the top 20% of households receive a little over half of all income but hold the large majority of wealth. The <b>Gini coefficient</b> measures inequality from 0 (perfect equality) to 1 (one person has everything).</p>
<p>A common model of U.S. classes: the <b>upper class</b> (a few percent; “old money” inherited over generations vs. “new money” recently earned), the <b>upper-middle class</b> (professionals, managers), the <b>middle class</b>, the <b>working class</b> (manual and routine service jobs), the <b>working poor</b>, and the <b>underclass</b> (persistently poor, often outside the labor market).</p>

<h3>Poverty</h3>
<p><b>Absolute poverty</b> is a lack of resources that threatens survival; <b>relative poverty</b> is being deprived compared with others who have more. The official U.S. <b>poverty line</b> (designed by Mollie Orshansky in the 1960s) was set at about <b>three times the cost of a minimum food budget</b>, adjusted for family size.</p>
<p>Who is poor? Under the official U.S. measure, <b>children</b> have the highest poverty rate of any age group. Poverty rates are higher for African Americans, Hispanics, and Native Americans than for non-Hispanic whites, though whites are the largest number of poor people. Households headed by single women are much more likely to be poor — the <b>feminization of poverty</b>. Most poor adults who can work do work at least part of the year.</p>
<p>Explanations:</p>
<ul>
<li><b>Individual / cultural</b>: Oscar <b>Lewis</b>'s <b>culture of poverty</b> — poor people develop values (present-time orientation, fatalism) that keep them poor across generations. Critics call this <b>“blaming the victim”</b> (William Ryan's phrase).</li>
<li><b>Structural</b>: William Julius <b>Wilson</b> (<i>The Truly Disadvantaged</i>, <i>When Work Disappears</i>) argued that concentrated urban poverty results mainly from the <b>disappearance of manufacturing jobs</b> from inner cities and the departure of middle-class residents, not from bad values.</li>
</ul>

<h3>Social mobility</h3>
<p><b>Social mobility</b> is movement within a stratification system.</p>
<ul>
<li><b>Vertical</b> (up or down) vs. <b>horizontal</b> (to a different job at the same level — a teacher becomes a social worker).</li>
<li><b>Intergenerational</b> — a child's position compared with the parents' (a janitor's daughter becomes a surgeon).</li>
<li><b>Intragenerational</b> — change during one person's own career (a cashier who becomes a store owner).</li>
<li><b>Structural mobility</b> — mobility caused by <b>changes in the economy</b> rather than individual effort. In the 20th century, the decline of farming and growth of white-collar work moved millions upward.</li>
<li><b>Exchange mobility</b> — some move up while others move down, leaving the overall structure unchanged.</li>
</ul>
<p>Peter <b>Blau and Otis Dudley Duncan</b> (<i>The American Occupational Structure</i>, 1967) found that <b>education</b> was the most important factor in occupational attainment, though family background strongly shapes how much education people get.</p>

<h3>Professions and occupations</h3>
<p>A <b>profession</b> is a prestigious white-collar occupation with: (1) <b>theoretical, specialized knowledge</b>, (2) <b>long formal training</b> and credentials, (3) <b>self-regulation</b> through professional associations and codes of ethics, (4) <b>authority over clients</b>, and (5) a <b>service orientation</b> toward the community. Medicine and law are the models; many occupations seek this status (<b>professionalization</b>).</p>
<p><b>Occupational prestige</b> rankings are remarkably stable over time and across countries: physicians, scientists, lawyers, and professors rank near the top; jobs requiring little training and paying little rank lowest. Other labels: <b>white-collar</b> (office/professional), <b>blue-collar</b> (manual), <b>pink-collar</b> (low-paid service and clerical jobs historically held by women). The <b>dual labor market</b> divides a <b>primary</b> sector (good pay, benefits, security) from a <b>secondary</b> sector (low pay, little security). Harry Braverman warned of <b>deskilling</b> — breaking skilled jobs into simple tasks, which lowers workers' control and pay.</p>

<h3>Global stratification</h3>
<p>Nations are grouped as high-, middle-, and low-income. Three theories explain the gap:</p>
<ul>
<li><b>Modernization theory</b> (functionalist; W.W. <b>Rostow</b>'s stages: traditional → <b>take-off</b> → drive to technological maturity → high mass consumption): poor nations are poor because of <b>traditional cultures and outdated technology</b>; they can develop by adopting modern values and technology, with help from rich nations.</li>
<li><b>Dependency theory</b> (conflict; Andre Gunder Frank): poor nations are poor because rich nations <b>exploited them</b> through colonialism and continue to do so through debt and <b>multinational corporations</b> (<b>neocolonialism</b>).</li>
<li><b>World-systems theory</b> (Immanuel <b>Wallerstein</b>): one capitalist world economy divided into a rich <b>core</b> (U.S., Western Europe, Japan), a <b>semiperiphery</b> (e.g., Brazil, Mexico), and a poor <b>periphery</b> that supplies raw materials and cheap labor.</li>
</ul>
`,

lesson:`
<h3>Race and ethnicity</h3>
<p>A <b>race</b> is a category of people seen as distinct because of shared, inherited <b>physical traits</b> such as skin color. Biologists find more genetic variation <b>within</b> so-called races than between them, so sociologists treat race as a <b>social construction</b>: the categories and their meanings are created by societies and change over time (Irish and Italian immigrants were once not considered “white” by many Americans).</p>
<p>An <b>ethnic group</b> shares a <b>cultural heritage</b> — ancestry, language, religion, traditions. Race is about perceived biology; ethnicity is about culture. Many people identify as <b>multiracial</b>.</p>

<h3>Minority and dominant groups</h3>
<p>Louis <b>Wirth</b> defined a <b>minority group</b> as a category of people singled out for <b>unequal treatment</b> because of physical or cultural traits. Characteristics: (1) members experience <b>unequal treatment and less power</b>; (2) they share distinctive physical or cultural traits; (3) membership is <b>ascribed</b>; (4) members have a sense of <b>group solidarity</b>; (5) they tend to marry within the group (<b>endogamy</b>).</p>
<p>“Minority” refers to <b>power, not numbers</b>. Under apartheid, Black South Africans were the large majority of the population but a minority group. The <b>dominant group</b> holds the most power, wealth, and prestige.</p>

<h3>Prejudice and discrimination</h3>
<p><b>Prejudice</b> is a rigid, irrational <b>attitude</b> — prejudging a whole category of people. A <b>stereotype</b> is an exaggerated description applied to everyone in a category. <b>Racism</b> is the belief that one racial category is innately superior or inferior to another. <b>Discrimination</b> is <b>behavior</b>: treating people unequally because of their category.</p>
<p>Robert <b>Merton</b> showed that prejudice and discrimination do not always go together:</p>
<ul>
<li><b>Unprejudiced nondiscriminator</b> (“all-weather liberal”).</li>
<li><b>Unprejudiced discriminator</b> (“fair-weather liberal”) — discriminates to fit in or for profit despite no personal bias.</li>
<li><b>Prejudiced nondiscriminator</b> (“timid bigot”) — biased but does not act on it, often because of laws or social pressure.</li>
<li><b>Prejudiced discriminator</b> (“active bigot”).</li>
</ul>
<p><b>Individual discrimination</b> is one person's act. <b>Institutional discrimination</b> (Stokely Carmichael and Charles Hamilton's “institutional racism”) is bias built into the normal operation of institutions — schools, banks, courts — often with <b>no intent to discriminate</b>.</p>
<div class="ex">A company hires only through referrals from current employees. If the current staff is nearly all white, the policy keeps excluding minority applicants even though no one intends to discriminate — institutional discrimination.</div>

<h3>Why prejudice exists</h3>
<ul>
<li><b>Scapegoat theory</b> (frustration-aggression): frustrated people blame a powerless group for their problems (e.g., blaming immigrants for job losses during a recession).</li>
<li><b>Authoritarian personality</b> (Theodor <b>Adorno</b> and colleagues, 1950): people with rigid, conformist personalities who think in black-and-white terms are more likely to be prejudiced against all minorities.</li>
<li><b>Culture theory</b>: prejudice is learned as part of culture. Emory <b>Bogardus</b>'s <b>social distance scale</b> measured how close people would let members of other groups come (as neighbors, coworkers, in-laws).</li>
<li><b>Conflict theory</b>: elites benefit when workers are divided by race. Edna Bonacich's <b>split labor market</b>: employers pit higher-paid and lower-paid workers of different groups against each other.</li>
<li><b>Self-fulfilling prophecy</b> (Merton): a false definition of a situation produces behavior that makes it come true — denying a group education, then calling it “uneducated.”</li>
</ul>
<p>Reducing prejudice: Gordon <b>Allport</b>'s <b>contact hypothesis</b> (<i>The Nature of Prejudice</i>, 1954) holds that contact reduces prejudice when groups meet with <b>equal status</b>, share <b>common goals</b>, cooperate, and have institutional support. Muzafer Sherif's <b>Robbers Cave</b> experiment created hostility between two boys' camp groups through competition, then reduced it with <b>superordinate goals</b> that required cooperation.</p>

<h3>Patterns of intergroup relations</h3>
<p>From most to least accepting:</p>
<ul>
<li><b>Pluralism</b> — groups keep their distinct cultures while having roughly equal standing. <b>A + B + C = A + B + C</b>. Switzerland, with several language groups, is a common example.</li>
<li><b>Assimilation</b> — a minority gradually adopts the dominant culture. <b>A + B + C = A</b>. Milton <b>Gordon</b> described stages: <b>cultural assimilation</b> (acculturation — language, customs), <b>structural assimilation</b> (entry into clubs, jobs, neighborhoods), and <b>marital assimilation</b> (intermarriage).</li>
<li><b>Amalgamation</b> — groups blend biologically and culturally into a new group: the <b>“melting pot.”</b> <b>A + B + C = D</b>.</li>
<li><b>Segregation</b> — physical and social separation. <b>De jure</b> segregation is required by law (Jim Crow laws in the South). <b>De facto</b> segregation exists in practice without law (neighborhoods and schools separated by housing patterns).</li>
<li><b>Population transfer</b> (expulsion) — forcing a group to leave (the 1830s removal of the Cherokee on the <b>Trail of Tears</b>).</li>
<li><b>Internal colonialism</b> — a dominant group exploits a minority within the same society.</li>
<li><b>Genocide</b> — the systematic killing of a category of people (the Holocaust; Rwanda, 1994).</li>
</ul>

<h3>Racial and ethnic groups in the United States</h3>
<p><b>Native Americans</b> lost most of their land through wars, treaties, and forced removal (Indian Removal Act, 1830); today many live on reservations and they have among the highest poverty rates of any group.</p>
<p><b>African Americans</b> endured slavery, then <b>Jim Crow</b> segregation upheld by <i>Plessy v. Ferguson</i> (1896), which approved “<b>separate but equal</b>” facilities. <i>Brown v. Board of Education</i> (1954) declared segregated public schools unconstitutional. The civil rights movement won the <b>Civil Rights Act of 1964</b> (banning discrimination in employment and public accommodations) and the <b>Voting Rights Act of 1965</b>. Large gaps in wealth, income, and incarceration remain.</p>
<p><b>Hispanics/Latinos</b> — people of Mexican, Puerto Rican, Cuban, and other Latin American origin — became the <b>largest U.S. minority group</b> in the early 2000s. Hispanic is an <b>ethnic</b> category: Hispanics may be of any race.</p>
<p><b>Asian Americans</b> faced the <b>Chinese Exclusion Act</b> (1882) and the <b>internment of Japanese Americans</b> during World War II. Today their high average income and education have produced the “<b>model minority</b>” stereotype, which hides wide variation between groups and pits minorities against one another.</p>
<p><b>Affirmative action</b> policies give some preference to underrepresented groups in hiring and admissions to remedy past discrimination; they remain controversial and have been narrowed by the courts. <b>Hate crimes</b> are crimes motivated by bias against a race, religion, ethnicity, or other group identity.</p>
`,

lesson:`
<h3>Sex and gender</h3>
<p><b>Sex</b> refers to biological differences — chromosomes, anatomy, hormones. <b>Gender</b> refers to the <b>social and cultural</b> meanings attached to being male or female: the personality traits, behaviors, and roles a society expects. <b>Gender roles</b> are those expectations; <b>gender identity</b> is a person's own sense of being male, female, or another gender.</p>
<p>The best evidence that gender is learned comes from cross-cultural variation. Anthropologist Margaret <b>Mead</b> (<i>Sex and Temperament in Three Primitive Societies</i>, 1935) studied three New Guinea societies: among the <b>Arapesh</b>, both sexes were gentle and nurturing; among the <b>Mundugumor</b>, both were aggressive; among the <b>Tchambuli</b>, gender roles were roughly reversed from Western norms, with women dominant and practical and men more emotional and concerned with appearance.</p>
<p><b>Gender socialization</b> begins at birth through parents (pink vs. blue, dolls vs. trucks), peers, schools (teachers' differing attention), and the media. Candace West and Don Zimmerman describe “<b>doing gender</b>”: people continually perform gender in everyday interaction.</p>

<h3>Gender stratification</h3>
<p><b>Patriarchy</b> (“rule of fathers”) is a system in which men dominate women; no society is known to be a true <b>matriarchy</b>. <b>Sexism</b> is the belief that one sex is innately superior, used to justify unequal treatment.</p>
<p>At work:</p>
<ul>
<li>Women make up nearly half the U.S. labor force but face <b>occupational segregation</b> — concentration in lower-paid “pink-collar” jobs (administrative assistants, child-care workers, nurses).</li>
<li>The <b>gender pay gap</b>: women working full time earn roughly <b>82–84 cents</b> for every dollar men earn. Causes include occupational segregation, time out for caregiving, and discrimination. <b>Comparable worth</b> proposals would pay jobs of equal value equally.</li>
<li>The <b>glass ceiling</b> is an invisible barrier that keeps women from top positions. Christine Williams's <b>glass escalator</b> describes how men in female-dominated jobs (nursing, teaching) are often promoted quickly.</li>
</ul>
<p>At home, Arlie <b>Hochschild</b> (<i>The Second Shift</i>, 1989) found that employed wives still did most housework and child care — a “<b>second shift</b>” after paid work. Women also face higher rates of poverty (the <b>feminization of poverty</b>, Unit 7) and of sexual harassment and domestic violence.</p>
<p>In education, the gap has reversed: women now earn the majority of U.S. bachelor's degrees. <b>Title IX</b> (1972) banned sex discrimination in federally funded education, including school sports.</p>

<h3>Theories of gender</h3>
<p><b>Functionalism</b>: Talcott <b>Parsons</b> argued that gender roles complement each other in the family. Men take <b>instrumental</b> roles (task-oriented breadwinner), women <b>expressive</b> roles (emotional support, child care), which keeps the family stable. Critics say this justifies inequality and fits only some middle-class families of the 1950s.</p>
<p><b>Conflict / feminist theory</b>: gender is a system of <b>power</b> that benefits men. Friedrich Engels linked women's subordination to private property and inheritance. Feminism has several strands: <b>liberal</b> feminism seeks equal rights within the existing system; <b>socialist</b> feminism links women's oppression to capitalism; <b>radical</b> feminism sees patriarchy as the root problem.</p>
<p>The “waves” of U.S. feminism:</p>
<ul>
<li><b>First wave</b> (mid-1800s to 1920) — the right to vote, won with the <b>19th Amendment</b> (1920). The 1848 Seneca Falls convention was its start.</li>
<li><b>Second wave</b> (1960s–1970s) — workplace, family, and reproductive equality; Betty <b>Friedan</b>'s <i>The Feminine Mystique</i> (1963) described suburban housewives' “problem that has no name.”</li>
<li><b>Third wave</b> (1990s on) — diversity among women and <b>intersectionality</b>, Kimberlé <b>Crenshaw</b>'s term for how race, class, gender, and other identities overlap to create distinct experiences of disadvantage.</li>
</ul>
<p><b>Symbolic interactionists</b> study how gender is created in everyday talk and display — who interrupts, who is called by first name.</p>

<h3>Aging</h3>
<p><b>Gerontology</b> is the study of aging and the elderly. The U.S. population is <b>“graying”</b>: life expectancy has risen, birth rates have fallen, and the large <b>baby boom</b> generation (born 1946–1964) is reaching old age. Women outlive men by several years, so the oldest age groups are mostly female. Because of <b>Social Security</b> and <b>Medicare</b> (1965), poverty among people 65 and over has fallen dramatically since the 1960s. The <b>sandwich generation</b> cares for both children and aging parents.</p>
<p><b>Ageism</b> (a term coined by Robert <b>Butler</b>, 1969) is prejudice and discrimination against people because of their age, usually the old. Stereotypes include seeing older people as frail, forgetful, or unproductive.</p>
<p>Theories of aging:</p>
<ul>
<li><b>Disengagement theory</b> (Elaine <b>Cumming</b> and William <b>Henry</b>, 1961 — functionalist): as people age, they and society gradually <b>withdraw from each other</b>. Retirement lets older people prepare for death and opens positions for the young, so the process benefits both. Critics: many older people do not want to disengage, and forced disengagement harms well-being.</li>
<li><b>Activity theory</b> (symbolic interactionist): older people who <b>stay active</b> and replace lost roles with new ones (volunteering, part-time work, hobbies) are happier and healthier.</li>
<li><b>Continuity theory</b>: people tend to keep the habits and personality they had in middle age.</li>
<li><b>Conflict theory</b>: age groups compete for scarce resources such as jobs and government benefits; capitalism devalues older workers and may replace them with cheaper younger ones. Organized seniors (such as AARP) wield “gray power.”</li>
<li><b>Age stratification theory</b> (Matilda White Riley): each society ranks people by age, giving age groups different roles and rewards.</li>
</ul>

<h3>Death and dying</h3>
<p>Elisabeth <b>Kübler-Ross</b> (<i>On Death and Dying</i>, 1969) described five stages people often go through when facing death: <b>denial</b> (“not me”), <b>anger</b> (“why me?”), <b>bargaining</b> (“if I can just…”), <b>depression</b>, and <b>acceptance</b>. Later research shows people do not always move through them in order. <b>Hospice</b> care aims to comfort dying people rather than cure them, often at home.</p>
