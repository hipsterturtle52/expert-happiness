const UNITS = [];   // filled by U({...}) blocks below
const QB = [];      // filled by Q(...) calls below
function U(o){ UNITS.push(o); }
/* Q(unit, set, difficulty, stem, options, explanations)
   set: q = unit quiz, d = diagnostic, a = practice exam 1, b = practice exam 2
   difficulty: E / M / H. In the source the CORRECT option is always written first;

</script>

<!-- ============ UNIT CONTENT ============ -->
<script>
U({id:"u1",area:"persp",weight:10,minutes:17,title:"History of Sociology & Major Theories",
intro:"Who founded sociology, what each founder argued, and the three big lenses (functionalism, conflict, symbolic interactionism) that show up in questions across every unit.",
must:[
"<b>Auguste Comte</b> coined “sociology” and championed <b>positivism</b>: studying society with the methods of natural science. Law of three stages: theological → metaphysical → positive (scientific).",
"<b>Émile Durkheim</b>: <b>social facts</b> (external forces that constrain individuals); <i>Suicide</i> showed suicide rates rise and fall with social <b>integration</b> and <b>regulation</b>; <b>anomie</b> = normlessness; <b>mechanical</b> (sameness, traditional) vs. <b>organic</b> (interdependence, modern) solidarity.",
"<b>Karl Marx</b>: history is class conflict; <b>bourgeoisie</b> own the <b>means of production</b>, <b>proletariat</b> sell their labor; <b>false consciousness</b> vs. <b>class consciousness</b>; <b>alienation</b>.",
"<b>Max Weber</b>: <b>verstehen</b> (understand action from the actor's view); <i>The Protestant Ethic and the Spirit of Capitalism</i>; <b>rationalization</b> and <b>bureaucracy</b>; <b>ideal type</b>; <b>value-free</b> research.",
"<b>C. Wright Mills</b>: the <b>sociological imagination</b> links personal troubles to public issues (history + biography).",
"<b>Functionalism</b> (macro): society as a system of parts that maintain stability — Durkheim, Parsons, <b>Merton</b> (manifest vs. <b>latent</b> functions, <b>dysfunctions</b>).",
"<b>Conflict theory</b> (macro): society as competition over scarce resources and power — Marx, Mills, Dahrendorf, Coser, Collins.",
"<b>Symbolic interactionism</b> (micro): people act on shared meanings created in interaction — Mead, Cooley, Blumer (named it), Goffman's <b>dramaturgy</b>.",
"<b>Thomas theorem</b>: “If people define situations as real, they are real in their consequences.”",
"Firsts: <b>Spencer</b> — “survival of the fittest,” social Darwinism; <b>Martineau</b> — translated Comte, first woman sociologist; <b>Du Bois</b> — <i>The Philadelphia Negro</i>, double consciousness; <b>Addams</b> — Hull House; first U.S. department at the University of Chicago (1892)."
],
lesson:`
<h3>What sociology is</h3>
<p><b>Sociology</b> is the systematic, scientific study of society, social groups, and social behavior. Psychology asks what is going on inside an individual; sociology asks how the groups and structures around people shape what they do.</p>
<p>The key habit is what <b>C. Wright Mills</b> (1959) called the <b>sociological imagination</b>: seeing the link between <b>personal troubles</b> (my own unemployment) and <b>public issues</b> (an unemployment rate of 10%). It connects <b>biography</b> with <b>history</b>. <b>Peter Berger</b> described the same habit as “seeing the general in the particular.”</p>
<div class="ex">One person losing a job may be bad luck. Millions losing jobs in a recession is a public issue rooted in the economy — that is the sociological imagination at work.</div>

<h3>Why sociology was born</h3>
<p>Sociology emerged in 19th-century Europe as a <b>response to upheaval</b>: the <b>Industrial Revolution</b> pulled people from farms into factories, cities grew fast (<b>urbanization</b>), and the <b>French Revolution</b> overturned old political and religious authority. Thinkers wanted to explain two things: what holds society together (<b>order</b>) and why societies transform (<b>change</b>).</p>

<h3>The founders</h3>
<p><b>Auguste Comte</b> (French, 1798–1857) <b>coined the word “sociology”</b> and is often called its founder. He promoted <b>positivism</b>: society should be studied with the same scientific methods as the natural world — observation, comparison, experiment. His <b>law of three stages</b> says human thought moves from <b>theological</b> (explaining events by gods) to <b>metaphysical</b> (abstract forces) to <b>positive/scientific</b>. He split the field into <b>social statics</b> (order) and <b>social dynamics</b> (change).</p>
<p><b>Harriet Martineau</b> (English, 1802–1876) <b>translated Comte's work into English</b>, wrote <i>Society in America</i>, and wrote one of the first books on research method (<i>How to Observe Morals and Manners</i>). She is often called the first woman sociologist.</p>
<p><b>Herbert Spencer</b> (English, 1820–1903) compared society to a living <b>organism</b> whose parts work together, and applied evolution to society. He coined the phrase <b>“survival of the fittest”</b> — the root of <b>social Darwinism</b>, the idea that inequality reflects natural fitness and that government should not help the poor. Sociologists today reject social Darwinism, but his organism analogy fed functionalism.</p>
<p><b>Karl Marx</b> (German, 1818–1883) saw history as a story of <b>class conflict</b>. Under capitalism, the <b>bourgeoisie</b> (capitalists) own the <b>means of production</b> (factories, land, tools) and the <b>proletariat</b> (workers) must sell their labor. Workers suffer <b>alienation</b> — they are cut off from the product of their labor, the work process, other people, and their own human potential. Workers who accept the system that exploits them have <b>false consciousness</b>; once they recognize their shared interests they gain <b>class consciousness</b> and, Marx predicted, revolt. His <b>economic determinism</b> (historical materialism) says the economy is the <b>base</b> that shapes the <b>superstructure</b> (law, religion, politics). He wrote <i>The Communist Manifesto</i> (1848) with Friedrich Engels and <i>Das Kapital</i>.</p>
<p><b>Émile Durkheim</b> (French, 1858–1917) made sociology an academic discipline (he founded one of the first European sociology departments at Bordeaux in 1895). He argued sociology studies <b>social facts</b> — patterns such as laws, customs, and rates that exist outside individuals and <b>constrain</b> them. In <i>The Division of Labor in Society</i> (1893) he contrasted <b>mechanical solidarity</b> (traditional societies held together by sameness — people do similar work and share beliefs) with <b>organic solidarity</b> (modern societies held together by <b>interdependence</b> — specialized workers need each other). Rapid change can produce <b>anomie</b>, a state of normlessness where rules no longer guide behavior.</p>
<p>In <i>Suicide</i> (1897) Durkheim showed that even the most personal act follows social patterns. Suicide rates depend on <b>integration</b> (how tied you are to groups) and <b>regulation</b> (how much norms control you):</p>
<ul>
<li><b>Egoistic</b> — too little integration (e.g., isolated individuals; Protestants had higher rates than Catholics, whose church bound them more tightly).</li>
<li><b>Altruistic</b> — too much integration (sacrificing oneself for the group, e.g., soldiers).</li>
<li><b>Anomic</b> — too little regulation (sudden economic crash or sudden wealth).</li>
<li><b>Fatalistic</b> — too much regulation (prisoners, slaves with no hope).</li>
</ul>
<p>In <i>The Elementary Forms of Religious Life</i> (1912) he divided the world into the <b>sacred</b> and the <b>profane</b> (see Unit 10).</p>
<p><b>Max Weber</b> (German, 1864–1920; pronounced “VAY-ber”) said sociology must grasp the meaning people attach to their actions — <b>verstehen</b> (“understanding”). In <i>The Protestant Ethic and the Spirit of Capitalism</i> (1904–05) he argued that <b>ideas can drive economic change</b>: Calvinist belief in predestination pushed believers toward disciplined work and saving, which helped capitalism grow — a direct answer to Marx's economic determinism. He described modern life as increasingly governed by <b>rationalization</b> (efficiency, calculation, rules), seen most clearly in <b>bureaucracy</b>, and warned of an “<b>iron cage</b>.” He used <b>ideal types</b> — pure, exaggerated models used for comparison — and insisted research be <b>value-free</b>: personal values should not bias how data are collected and interpreted. He also defined three types of authority and the three dimensions of stratification: class, status, and party (Units 7 and 11).</p>
<p><b>Georg Simmel</b> (German, 1858–1918) studied the <b>forms</b> of interaction regardless of content. He noticed that a <b>dyad</b> (two people) is intimate but fragile, while a <b>triad</b> (three) is more stable but allows coalitions and mediators. He also wrote about <b>the stranger</b> and about how city life makes people reserved and blasé.</p>

<h3>Sociology in the United States</h3>
<p>The first U.S. sociology department opened at the <b>University of Chicago</b> in 1892. The <b>Chicago School</b> treated the city as a laboratory, studying neighborhoods, immigrants, and crime (Robert <b>Park</b> and Ernest <b>Burgess</b> — see Unit 12).</p>
<p><b>W.E.B. Du Bois</b> (1868–1963), the first African American to earn a Harvard Ph.D., wrote <i>The Philadelphia Negro</i> (1899), an early empirical community study, and in <i>The Souls of Black Folk</i> (1903) described <b>double consciousness</b>: Black Americans seeing themselves both through their own eyes and through the eyes of a society that looks down on them. He helped found the NAACP.</p>
<p><b>Jane Addams</b> co-founded <b>Hull House</b> (1889), a Chicago settlement house that served immigrants and gathered data on urban poverty. She won the Nobel Peace Prize in 1931.</p>
<p><b>W.I. Thomas</b> stated the <b>Thomas theorem</b>: “If men define situations as real, they are real in their consequences.” Beliefs, even false ones, shape behavior.</p>

<h3>The three major perspectives</h3>
<p><b>Macro-level</b> analysis looks at large structures (the economy, social class); <b>micro-level</b> analysis looks at face-to-face interaction. The three classic theories split along that line.</p>
<p><b>1. Structural functionalism</b> (macro). Society is a system of interrelated parts (institutions) that each serve a <b>function</b> and keep the whole stable — like organs in a body. Society rests on <b>consensus</b> about values. Roots: Spencer and Durkheim. <b>Talcott Parsons</b> made it the dominant U.S. theory in the 1940s–50s. <b>Robert K. Merton</b> refined it: <b>manifest functions</b> are intended and recognized; <b>latent functions</b> are unintended and often unnoticed; <b>dysfunctions</b> are consequences that disrupt the system. He also favored <b>middle-range theories</b> that can be tested. Critics say functionalism justifies the status quo and struggles to explain conflict and change.</p>
<div class="ex">The manifest function of college is education. Latent functions: meeting a spouse, keeping young adults out of the job market. A dysfunction: student debt.</div>
<p><b>2. Conflict theory</b> (macro). Society is an arena of <b>inequality</b> in which groups compete for <b>scarce resources</b> — wealth, power, prestige — and those on top use institutions to protect their advantage. Change comes from conflict. Roots: Marx. Later conflict theorists: <b>C. Wright Mills</b> (the <b>power elite</b>), <b>Ralf Dahrendorf</b> (conflict over authority, not just ownership), <b>Lewis Coser</b> (conflict can strengthen group unity), <b>Randall Collins</b>. <b>Feminist theory</b> applies a conflict lens to gender inequality. Critics say it overlooks consensus and stability.</p>
<p><b>3. Symbolic interactionism</b> (micro). People act toward things based on the <b>meanings</b> those things have, and meanings are created and changed in <b>interaction</b> through <b>symbols</b> such as language and gestures. Roots: <b>George Herbert Mead</b> (the self, Unit 3) and <b>Charles Horton Cooley</b> (the looking-glass self). <b>Herbert Blumer</b>, Mead's student, coined the term “symbolic interactionism.” <b>Erving Goffman</b>'s <b>dramaturgy</b> treats life as theater: we manage impressions on a <b>front stage</b> and relax <b>backstage</b> (<i>The Presentation of Self in Everyday Life</i>, 1959). Critics say it neglects large structures like class.</p>

<h3>Other approaches you should recognize</h3>
<ul>
<li><b>Social exchange / rational choice theory</b> (<b>George Homans</b>, <b>Peter Blau</b>): people weigh costs and rewards in relationships.</li>
<li><b>Ethnomethodology</b> (<b>Harold Garfinkel</b>): studies the taken-for-granted rules of everyday life, often by <b>breaching experiments</b> that break a rule (e.g., bargaining over the price of groceries) to reveal it.</li>
<li><b>Feminist theory</b>: gender as a central axis of inequality and power.</li>
</ul>
<div class="ex">Look at sports through each lens. Functionalist: sports build teamwork and shared identity. Conflict: team owners profit while athletes and taxpayers bear the costs. Interactionist: what a jersey or a handshake means to fans.</div>

/* ---------- generic question runner (quiz / diagnostic / drill) ---------- */
function runner({qs,mode,title,back,onFinish}){
 let i=0,chosen=null,locked=false;const res=[];
 function draw(){
  const q=qs[i];chosen=null;locked=false;
  V().innerHTML='<div class="runner"><div class="rhead"><a href="'+back+'">← Exit</a><span>'+esc(title)+'</span><span>'+(i+1)+' / '+qs.length+'</span></div><div class="bar"><i style="width:'+pct(i,qs.length)+'%"></i></div>'+
   optHTML(q,mode!=='diag')+'<div class="ractions"><button id="nx" class="btn primary" disabled>'+(mode==='diag'?(i<qs.length-1?'Next →':'Finish'):'Choose an answer')+'</button>'+(mode==='diag'?'<button id="skip" class="btn">I don\'t know</button>':'')+'</div>'+
   '<p class="hint"><kbd>1</kbd>–<kbd>5</kbd> or <kbd>A</kbd>–<kbd>E</kbd> to answer · <kbd>Enter</kbd> for next</p></div>';
  $$('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  $('#nx').onclick=next;
  if($('#skip'))$('#skip').onclick=()=>{record(null);};
 }
 function record(k){const q=qs[i];const ok=k!=null&&q.opts[k].ok;res.push({q,choice:k,ok});if(!ok)addMistake(q.id,mode);else if(mode==='drill'&&S.mistakes[q.id]){S.mistakes[q.id].streak++;}save();i++;if(i>=qs.length)onFinish(res);else draw();}
 function pick(k){
  if(locked)return;chosen=k;
  if(mode==='diag'){$$('.opt').forEach((b,j)=>b.classList.toggle('sel',j===k));$('#nx').disabled=false;return;}
  locked=true;reveal(V(),qs[i],k);const nx=$('#nx');nx.disabled=false;nx.textContent=i<qs.length-1?'Next →':'See results';
 }
 function next(){if(mode==='diag'){if(chosen==null)return;record(chosen);}else{if(!locked)return;record(chosen);}}
 keyHandler=e=>{const k=e.key.toLowerCase();if(/^[1-5]$/.test(k))pick(+k-1);else if(/^[a-e]$/.test(k))pick(LETTERS.toLowerCase().indexOf(k));else if(k==='enter'){e.preventDefault();next();}};
 draw();
}
function resultsHTML(res,title,extra){
 const c=res.filter(r=>r.ok).length,bu=byUnit(res);
 return'<h1>'+esc(title)+' — results</h1><div class="grid"><div class="stat"><b>'+pct(c,res.length)+'%</b><span>'+c+' of '+res.length+' correct</span></div></div>'+(extra||'')+
  '<h2>By unit</h2>'+UNITS.filter(u=>bu[u.id]).map(u=>hbar(u.short+' '+u.title,bu[u.id][0],bu[u.id][1])).join('')+
  '<h2>Review</h2><p class="muted small">Missed questions were added to your <a href="#/mistakes">mistake log</a>.</p>'+res.map(r=>reviewHTML(r.q,r.choice)).join('');
}

/* ---------- flashcards (Leitner) ---------- */
const INTERVAL=[0,0,1,3,7,16]; // days until due, by box 1..5
function cs(id){return S.cards[id];}
function unlocked(c){const s=S.units[c.u];return !!(s&&s.read)||!!(S.diag&&S.diag.res[c.u]);}
function dueCards(unit){const now=Date.now();return CARDS.filter(c=>(!unit||c.u===unit)&&cs(c.id)&&cs(c.id).due<=now);}
function newCards(unit){return CARDS.filter(c=>(!unit||c.u===unit)&&!cs(c.id)&&(unit||unlocked(c)));}
function missedCards(unit){return CARDS.filter(c=>(!unit||c.u===unit)&&cs(c.id)&&cs(c.id).miss);}
function viewCards(unit){
 const u=unit&&UNIT[unit];
 const box=[0,0,0,0,0,0];CARDS.filter(c=>!u||c.u===unit).forEach(c=>{const s=cs(c.id);box[s?s.box:0]++;});
 const due=dueCards(unit),nw=newCards(unit),ms=missedCards(unit);
 V().innerHTML='<h1>Flashcards'+(u?' — '+u.short+' '+esc(u.title):'')+'</h1><p class="muted">Leitner boxes: a card you get right moves up a box and comes back later (box 2: 1 day, 3: 3 days, 4: 7 days, 5: 16 days). A card you miss drops to box 1 and returns in the same session.</p>'+
 '<div class="boxes"><span><b>'+box[0]+'</b>new</span>'+[1,2,3,4,5].map(i=>'<span><b>'+box[i]+'</b>box '+i+'</span>').join('')+'</div>'+
 '<div class="card"><button class="btn primary" id="d1" '+(due.length+Math.min(nw.length,20)?'':'disabled')+'>Study due + new ('+due.length+' due, '+Math.min(nw.length,20)+' new)</button><button class="btn" id="d2" '+(ms.length?'':'disabled')+'>Review missed only ('+ms.length+')</button>'+(u?'<button class="btn" id="d3">Whole unit deck ('+u.cards.length+')</button>':'')+
 '<p class="small muted">'+(u?'':'New cards unlock when you mark a unit\'s lesson as read (or after the diagnostic). Pick a unit deck below to study any unit now.')+'</p></div>'+
 (u?'':'<h2>Unit decks</h2><div class="tablewrap"><table><tr><th>Unit</th><th>Cards</th><th>Learned (box 3+)</th><th>Due</th></tr>'+UNITS.map(x=>'<tr><td><a href="#/cards/'+x.id+'">'+x.short+' · '+esc(x.title)+'</a></td><td>'+x.cards.length+'</td><td>'+cardsLearned(x)+'</td><td>'+dueCards(x.id).length+'</td></tr>').join('')+'</table></div>');
 $('#d1').onclick=()=>cardSession(due.concat(shuffle(nw).slice(0,20)),unit);
 $('#d2').onclick=()=>cardSession(ms,unit);
 if($('#d3'))$('#d3').onclick=()=>cardSession(u.cards,unit);
}
function cardSession(list,unit){
 let q=shuffle(list),flipped=false,right=0,wrong=0;const back='#/cards'+(unit?'/'+unit:'');
 function draw(){
  if(!q.length){S.cardSessions++;save();V().innerHTML='<h1>Session done</h1><p>'+right+' right, '+wrong+' missed (missed cards were repeated until you got them).</p><a class="btn primary" href="'+back+'">Back to decks</a>';keyHandler=null;return;}
  const c=q[0],s=cs(c.id);flipped=false;
  V().innerHTML='<div class="rhead runner"><div class="rhead"><a href="'+back+'">← Exit</a><span>'+q.length+' left</span><span>'+UNIT[c.u].short+(s?' · box '+s.box:' · new')+'</span></div></div>'+
  '<div class="fc" id="fc"><div><div>'+esc(c.f)+'</div><div class="back" id="bk" hidden>'+c.b+'</div><div class="hint" id="fh">Click or press <kbd>Space</kbd> to flip</div></div></div>'+
  '<div class="ractions" id="ra" hidden><button class="btn" id="no">✗ Missed <kbd>1</kbd></button><button class="btn primary" id="yes">✓ Got it <kbd>2</kbd></button></div>';
  $('#fc').onclick=flip;$('#no').onclick=()=>grade(false);$('#yes').onclick=()=>grade(true);
 }
 function flip(){if(flipped)return;flipped=true;$('#bk').hidden=false;$('#fh').hidden=true;$('#ra').hidden=false;}
 function grade(ok){
  if(!flipped)return;const c=q.shift();const s=S.cards[c.id]||(S.cards[c.id]={box:0,due:0,miss:false,n:0,lapses:0});s.n++;
  if(ok){right++;s.box=Math.min(5,Math.max(1,s.box)+1);s.due=Date.now()+INTERVAL[s.box]*DAY;if(s.box>=3)s.miss=false;}
  else{wrong++;s.box=1;s.due=Date.now();s.miss=true;s.lapses++;q.splice(Math.min(3,q.length),0,c);}
  save();draw();
 }
 keyHandler=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}else if(e.key==='1'||e.key==='ArrowLeft')grade(false);else if(e.key==='2'||e.key==='ArrowRight')grade(true);};
 draw();
}

 '<div class="card"><button class="btn primary" id="dr" '+(open.length?'':'disabled')+'>Drill '+Math.min(20,open.length)+' questions</button>'+(mastered?'<button class="btn" id="cl">Clear mastered</button>':'')+'</div>'+
 (open.length?'<h2>Queue by unit</h2>'+UNITS.map(u=>{const l=open.filter(([id])=>QID[id].u===u.id);return l.length?'<h3>'+u.short+' · '+esc(u.title)+' ('+l.length+')</h3>'+l.map(([id,m])=>reviewHTML(QID[id],null).replace('<summary>✗','<summary>✗ ×'+m.n+(m.streak?' (streak '+m.streak+')':''))).join(''):'';}).join(''):'<p>No mistakes queued. 🎉</p>');
 $('#dr').onclick=()=>runner({qs:shuffle(open.map(([id])=>QID[id])).slice(0,20),mode:'drill',title:'Mistake drill',back:'#/mistakes',onFinish:res=>{drawNav();V().innerHTML=resultsHTML(res,'Mistake drill','<p><a class="btn primary" href="#/mistakes">Back to mistake log</a></p>');window.scrollTo(0,0);}});
 if($('#cl'))$('#cl').onclick=()=>{Object.keys(S.mistakes).forEach(id=>{if(S.mistakes[id].streak>=2)delete S.mistakes[id];});save();viewMistakes();drawNav();};
}

/* ---------- practice exams ---------- */
const EXAMS={a:'Practice Exam 1',b:'Practice Exam 2'};
function examQs(k){return shuffle(QB.filter(q=>q.s===k),rng(hash('exam-order-'+k)));}
function liveExam(){return['a','b'].find(k=>S.exams[k]&&S.exams[k].live);}
function timeLeft(k){return S.exams[k].live.start+OUTLINE.minutes*60000-Date.now();}
function fmt(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function examBanner(){
 const k=liveExam(),b=$('#examBanner');
 if(!k||location.hash.startsWith('#/exam/'+k)){b.style.display='none';return;}
 b.style.display='inline-block';b.href='#/exam/'+k;b.textContent='⏱ '+EXAMS[k]+' running · '+fmt(timeLeft(k));
}
setInterval(()=>{const k=liveExam();if(k&&timeLeft(k)<=0&&!location.hash.startsWith('#/exam/'+k)){submitExam(k,true);toast(EXAMS[k]+': time is up — submitted.');drawNav();}examBanner();},1000);
function viewExam(k){
 if(!EXAMS[k]){
  V().innerHTML='<h1>Practice exams</h1><p class="muted">Two full-length exams in the real format: '+OUTLINE.questions+' questions, '+OUTLINE.minutes+'-minute timer, no pausing. Every question is unique — none appear in the unit quizzes or diagnostic. Take them 1–2 days before your real exam.</p>'+
  ['a','b'].map(x=>{const e=S.exams[x],n=QB.filter(q=>q.s===x).length,l=lastExam(x);return'<div class="card"><h2 style="margin-top:0">'+EXAMS[x]+'</h2><p class="muted">'+n+' questions'+(l?' · last score <b>'+l.score+'%</b>'+(l.score>=75?' <span class="chip ok">≥75%</span>':' <span class="chip bad">below 75%</span>'):'')+(e&&e.live?' · <span class="chip warn">in progress</span>':'')+'</p><a class="btn primary" href="#/exam/'+x+'">'+(e&&e.live?'Resume':l?'View results / retake':'Start')+'</a></div>';}).join('');
  return;
 }
 const e=S.exams[k];
 if(e&&e.live){if(timeLeft(k)<=0){submitExam(k,true);return viewExamResult(k);}return examRun(k);}
 if(lastExam(k)&&!viewExam.intro)return viewExamResult(k);
 viewExam.intro=false;
 const n=QB.filter(q=>q.s===k).length,other=liveExam();
 V().innerHTML='<h1>'+EXAMS[k]+'</h1><div class="card"><ul><li><b>'+n+' questions</b>, five options each, mixed topics in official proportions.</li><li><b>'+OUTLINE.minutes+'-minute timer. No pausing</b> — the clock keeps running if you leave this page or close the tab.</li><li>You can skip, flag, and return to questions; unanswered = wrong. At 0:00 the exam submits automatically.</li><li>Results by topic at the end; every missed question goes to your mistake log.</li></ul>'+
 (lastExam(k)?'<p class="chip warn" style="white-space:normal">Retake: you have seen these questions, so a retake score overstates readiness.</p>':'')+
 (other?'<p class="chip bad">Finish '+EXAMS[other]+' first.</p>':'<button class="btn primary" id="st" '+(n?'':'disabled')+'>Start — timer begins now</button>')+'</div>';
 if($('#st'))$('#st').onclick=()=>{S.exams[k]=S.exams[k]||{attempts:[]};S.exams[k].live={start:Date.now(),ans:{},flag:{},cur:0};save();route();};
}
function examRun(k){
 const L=S.exams[k].live,qs=examQs(k);let showPal=false;
 function draw(){
  const i=L.cur,q=qs[i],a=L.ans[q.id];
  V().innerHTML='<div class="runner"><div class="rhead"><span>'+EXAMS[k]+'</span><span class="timer" id="tm">'+fmt(timeLeft(k))+'</span><span>'+(i+1)+' / '+qs.length+'</span></div><div class="bar"><i style="width:'+pct(Object.keys(L.ans).length,qs.length)+'%"></i></div>'+
  optHTML(q,false)+'<div class="ractions"><button class="btn" id="pv" '+(i?'':'disabled')+'>← Prev</button><button class="btn primary" id="nx">'+(i<qs.length-1?'Next →':'Review & submit')+'</button><button class="btn" id="fl">'+(L.flag[q.id]?'⚑ Flagged':'⚐ Flag')+'</button><button class="btn" id="pl">Grid</button><span class="spacer" style="flex:1"></span><button class="btn" id="sb">Submit exam</button></div>'+
  '<div id="pal" '+(showPal?'':'hidden')+'><div class="palette">'+qs.map((x,j)=>'<button data-j="'+j+'" class="'+(L.ans[x.id]!=null?'ans ':'')+(L.flag[x.id]?'flag ':'')+(j===i?'cur':'')+'">'+(j+1)+'</button>').join('')+'</div><p class="hint">'+Object.keys(L.ans).length+' answered · '+Object.keys(L.flag).filter(x=>L.flag[x]).length+' flagged</p></div>'+
  '<p class="hint"><kbd>1</kbd>–<kbd>5</kbd> answer · <kbd>Enter</kbd> next · <kbd>←</kbd> previous · <kbd>F</kbd> flag</p></div>';
  if(a!=null)$$('.opt')[a].classList.add('sel');
  $$('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  $('#pv').onclick=()=>go(i-1);$('#nx').onclick=()=>i<qs.length-1?go(i+1):submitAsk();
  $('#fl').onclick=()=>{L.flag[q.id]=!L.flag[q.id];save();draw();};
  $('#pl').onclick=()=>{showPal=!showPal;draw();};
  $('#sb').onclick=submitAsk;
  $$('#pal button').forEach(b=>b.onclick=()=>go(+b.dataset.j));
 }
 function pick(j){L.ans[qs[L.cur].id]=j;save();$$('.opt').forEach((b,x)=>b.classList.toggle('sel',x===j));}
 function go(j){if(j<0||j>=qs.length)return;L.cur=j;save();draw();}
 function submitAsk(){const un=qs.length-Object.keys(L.ans).length;if(confirm('Submit '+EXAMS[k]+'?'+(un?' '+un+' question(s) unanswered.':'')+' You cannot change answers afterward.')){submitExam(k,false);viewExamResult(k);drawNav();}}
 keyHandler=e=>{const x=e.key.toLowerCase();if(/^[1-5]$/.test(x))pick(+x-1);else if(/^[a-e]$/.test(x))pick(LETTERS.toLowerCase().indexOf(x));else if(x==='enter'){e.preventDefault();L.cur<qs.length-1?go(L.cur+1):submitAsk();}else if(x==='arrowleft')go(L.cur-1);else if(x==='arrowright')go(L.cur+1);else if(x==='f'){L.flag[qs[L.cur].id]=!L.flag[qs[L.cur].id];save();draw();}};
 viewTimer=setInterval(()=>{const t=timeLeft(k),el=$('#tm');if(el){el.textContent=fmt(t);el.classList.toggle('low',t<5*60000);}if(t<=0){clearInterval(viewTimer);viewTimer=null;keyHandler=null;submitExam(k,true);viewExamResult(k);drawNav();toast('Time is up — exam submitted.');}},500);
 draw();
}
function submitExam(k,timedOut){
 const E=S.exams[k],L=E.live;if(!L)return;const qs=examQs(k);
 const res=qs.map(q=>{const c=L.ans[q.id];return{q,choice:c==null?null:c,ok:c!=null&&q.opts[c].ok};});
 res.forEach(r=>{if(!r.ok)addMistake(r.q.id,k);});
 const c=res.filter(r=>r.ok).length;
 E.attempts.push({date:Date.now(),score:pct(c,res.length),correct:c,total:res.length,timedOut:!!timedOut,usedMs:Math.min(OUTLINE.minutes*60000,Date.now()-L.start),ans:L.ans,byArea:byArea(res),byUnit:byUnit(res)});
 delete E.live;save();
}
function viewExamResult(k){
 const a=lastExam(k),qs=examQs(k),res=qs.map(q=>{const c=a.ans[q.id];return{q,choice:c==null?null:c,ok:c!=null&&q.opts[c].ok};});
 let filt=false;
 function draw(){
  V().innerHTML='<h1>'+EXAMS[k]+' — results</h1><div class="grid"><div class="stat"><b>'+a.score+'%</b><span>'+a.correct+' of '+a.total+' correct</span></div><div class="stat"><b>'+fmt(a.usedMs)+'</b><span>time used'+(a.timedOut?' (timed out)':'')+'</span></div><div class="stat"><b>'+(a.score>=75?'✓':'✗')+'</b><span>'+(a.score>=75?'At or above the 75% readiness bar':'Below the 75% readiness bar')+'</span></div></div>'+
  '<h2>By content area (official weights)</h2>'+OUTLINE.areas.map(ar=>a.byArea[ar.id]?hbar(ar.name.replace(' (Process and Structure)','')+' ('+ar.weight+'%)',a.byArea[ar.id][0],a.byArea[ar.id][1]):'').join('')+
  '<h2>By unit</h2>'+UNITS.filter(u=>a.byUnit[u.id]).map(u=>hbar(u.short+' '+u.title,a.byUnit[u.id][0],a.byUnit[u.id][1])).join('')+
  '<p class="small muted">Weakest units first: re-read their must-know boxes and drill the mistake log.</p><p><a class="btn" href="#/mistakes">Mistake log</a><button class="btn" id="rt">Retake this exam</button><a class="btn" href="#/exam">All exams</a></p>'+
  (S.exams[k].attempts.length>1?'<p class="small muted">Attempts: '+S.exams[k].attempts.map(x=>x.score+'%').join(' → ')+'</p>':'')+
  '<h2>Review</h2><label class="small"><input type="checkbox" id="fm" '+(filt?'checked':'')+'> Show missed only</label>'+res.filter(r=>!filt||!r.ok).map(r=>reviewHTML(r.q,r.choice)).join('');
  $('#fm').onchange=e=>{filt=e.target.checked;draw();};
  $('#rt').onclick=()=>{viewExam.intro=true;viewExam(k);};
 }
 draw();
}

/* ---------- cheat sheet ---------- */
function viewCheat(){
 V().innerHTML='<div class="noprint" style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;justify-content:space-between"><p class="muted" style="margin:0">One page. Print it, then practice redrawing each box from memory.</p><span><button class="btn primary" id="pr">Print (1 page)</button><button class="btn" id="cd">'+(S.cheatDone?'✓ Redrawn from memory':'Mark: redrawn from memory')+'</button></span></div><h1>Introductory Sociology — Cheat Sheet</h1><div class="cheat">'+$('#tpl-cheat').innerHTML+'</div>';
 $('#pr').onclick=()=>{document.body.classList.add('printcheat');window.print();setTimeout(()=>document.body.classList.remove('printcheat'),500);};

/* ---------- study plan ---------- */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseYmd(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function makePlan(hpd,examStr){
 const today=new Date();today.setHours(0,0,0,0);const exam=parseYmd(examStr);
 const n=Math.round((exam-today)/DAY);if(!(n>=1))return{err:'Pick an exam date after today.'};
 const cap=Math.round(hpd*60),days=[];for(let i=0;i<n;i++)days.push({d:new Date(today.getTime()+i*DAY),items:[],used:0});
 const add=(day,l,m,href,cls)=>{day.items.push({l,m,href,cls});day.used+=m;};
 // reserve practice exams for the final 1–2 days
 const needA=!lastExam('a'),needB=!lastExam('b');
 const dB=days[n-1],dA=n>=2?days[n-2]:days[n-1];
 if(needA)add(dA,'Practice Exam 1 — 100 Qs, 90 min, timed',90,'#/exam/a','exam');
 if(needA)add(dA,'Review every Exam 1 miss, then drill the mistake log',45,'#/mistakes','exam');
 if(needB)add(dB,'Practice Exam 2 — 100 Qs, 90 min, timed',90,'#/exam/b','exam');
 add(dB,'Cheat sheet: redraw from memory; review weakest unit\'s must-know box',30,'#/cheat','exam');
 const studyDays=days.filter(d=>d!==dA&&d!==dB);
 const tasks=tasksRemaining().filter(t=>!t.cards).map(t=>Object.assign({},t));
 // weave each unit's flashcard first pass right after its quiz
 const cardT=tasksRemaining().filter(t=>t.cards);
 const ordered=[];tasks.forEach(t=>{ordered.push(t);if(/quiz/.test(t.l)){const c=cardT.find(x=>x.u===t.u);if(c){ordered.push(c);cardT.splice(cardT.indexOf(c),1);}}});
 cardT.forEach(c=>ordered.push(c));
 ordered.push({l:'Mistake-log drill (until queue is under 10)',m:40,href:'#/mistakes'});
 const review=cap>=60?15:10;
 let ti=0,rem=ordered.length?ordered[0].m:0,part=1;
 studyDays.forEach((day,idx)=>{
  if(idx>0)add(day,'Flashcards: due cards + missed',review,'#/cards');
  while(ti<ordered.length&&day.used<cap){
   const t=ordered[ti],room=cap-day.used;
   if(room<10&&day.items.length)break;
   if(rem<=room){add(day,t.l+(part>1?' (finish)':''),rem,t.href);ti++;rem=ti<ordered.length?ordered[ti].m:0;part=1;}
   else{add(day,t.l+' (part '+part+')',room,t.href);rem-=room;part++;}
  }
  if(ti>=ordered.length&&day.used<cap-20){add(day,'Retake your lowest-scoring unit quiz + mistake drill',Math.min(45,cap-day.used),'#/mistakes');}
 });
 const left=ti<ordered.length?ordered.slice(ti).reduce((a,t,j)=>a+(j===0?rem:t.m),0):0;
 const need=(ordered.reduce((a,t)=>a+t.m,0)+studyDays.length*review)/Math.max(1,studyDays.length)/60;
 return{days,exam,left,need:Math.ceil(need*4)/4,n};
}
function viewPlan(){
 const p=S.plan||{hpd:1.5,date:ymd(new Date(Date.now()+21*DAY))};
 V().innerHTML='<h1>Study plan</h1><p class="muted">Enter your daily hours and exam date. The plan follows the unit order, gives “Skim” units (from the diagnostic) about 40% less time, schedules flashcard review every day, and puts the two practice exams in the last 1–2 days before your exam. It updates as you complete work — regenerate any time.</p>'+
 '<div class="card noprint"><label class="f">Hours per day<input type="number" id="hp" min="0.5" max="10" step="0.25" value="'+p.hpd+'"></label><label class="f">Exam date<input type="date" id="dt" value="'+p.date+'"></label><button class="btn primary" id="mk">Generate plan</button><button class="btn" id="pp">Print</button><p class="small muted">Estimated work remaining: ~'+hoursLeft().toFixed(1)+' hours.</p></div><div id="out"></div>';
 function gen(){
  const hpd=Math.max(0.5,parseFloat($('#hp').value)||1.5),date=$('#dt').value;S.plan={hpd,date};save();
  const r=makePlan(hpd,date);if(r.err){$('#out').innerHTML='<p class="chip bad">'+r.err+'</p>';return;}
  const fmtD=d=>d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  $('#out').innerHTML=(r.left?'<div class="card" style="border-color:var(--bad)"><b>Not enough time.</b> About '+(r.left/60).toFixed(1)+' hours of work did not fit. Raise hours per day to about '+r.need.toFixed(1)+', move the exam date later, or rely on the diagnostic to skim more units.</div>':'<p class="chip ok">Everything fits. '+r.n+' day(s) until the exam.</p>')+
  '<div class="tablewrap"><table class="plan"><tr><th>Day</th><th>Tasks</th><th>Time</th></tr>'+r.days.map((d,i)=>'<tr class="'+(d.items.some(x=>x.cls==='exam')?'exam':'')+'"><td>'+fmtD(d.d)+'<br><span class="small muted">Day '+(i+1)+'</span></td><td><ul>'+(d.items.length?d.items.map(x=>'<li>'+(x.href?'<a href="'+x.href+'">'+esc(x.l)+'</a>':esc(x.l))+' <span class="muted small">'+x.m+'m</span></li>').join(''):'<li class="muted">Rest / light flashcards</li>')+'</ul></td><td>'+(d.used/60).toFixed(1)+'h</td></tr>').join('')+
  '<tr class="exam"><td>'+fmtD(r.exam)+'</td><td><b>EXAM DAY.</b> 10 minutes of flashcards at most. Bring ID; arrive early.</td><td></td></tr></table></div>';
 }
 $('#mk').onclick=gen;$('#pp').onclick=()=>window.print();if(S.plan)gen();
}

/* ---------- about & data ---------- */
function viewAbout(){
 const words=u=>strip(u.lesson+' '+u.must.join(' ')).split(' ').length;
 const totW=UNITS.reduce((a,u)=>a+words(u),0),totQ=QB.length,totC=CARDS.length;
 const uv='<span class="unverified">unverified</span>';
 V().innerHTML='<h1>About this guide</h1>'+
 '<div class="card"><h2 style="margin-top:0">Exam facts</h2><table><tr><th>Questions</th><td>About '+OUTLINE.questions+' (some are unscored pretest questions)</td></tr><tr><th>Time limit</th><td>'+OUTLINE.minutes+' minutes</td></tr><tr><th>Format</th><td>Multiple choice, five options</td></tr><tr><th>Score scale</th><td>'+OUTLINE.scale+'; ACE-recommended credit-granting score '+OUTLINE.passing+' ('+OUTLINE.credit+'). Individual colleges set their own policies.</td></tr></table>'+
 '<p class="small">Source: College Board, <a href="'+OUTLINE.url+'" target="_blank" rel="noopener">CLEP Introductory Sociology exam page</a> and the <a href="'+OUTLINE.glanceUrl+'" target="_blank" rel="noopener">“At a Glance” sheet</a>; retrieved '+OUTLINE.retrieved+'. The College Board site could not be loaded directly while this guide was built, so figures were confirmed from search extracts of those pages. Items that could not be confirmed are marked '+uv+'.</p></div>'+

 '<h3>Skills tested</h3><ul>'+OUTLINE.skills.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul><p class="small muted">The official page does not give a percentage for each skill, so none is shown.</p>'+
 '<h2>Content budget vs. official weights</h2><div class="tablewrap"><table><tr><th>Unit</th><th>Weight</th><th>Lesson words</th><th>Questions (quiz/diag/ex1/ex2)</th><th>Cards</th></tr>'+UNITS.map(u=>{const c=s=>QB.filter(q=>q.u===u.id&&q.s===s).length,t=QB.filter(q=>q.u===u.id).length;return'<tr><td>'+u.short+' '+esc(u.title)+'</td><td>'+u.weight+'%</td><td>'+words(u)+' ('+pct(words(u),totW)+'%)</td><td>'+t+' ('+pct(t,totQ)+'%) · '+c('q')+'/'+c('d')+'/'+c('a')+'/'+c('b')+'</td><td>'+u.cards.length+' ('+pct(u.cards.length,totC)+'%)</td></tr>';}).join('')+'<tr><th>Total</th><th>100%</th><th>'+totW+'</th><th>'+totQ+'</th><th>'+totC+'</th></tr></table></div>'+
 '<h2>Keyboard shortcuts</h2><table><tr><td><kbd>1</kbd>–<kbd>5</kbd> or <kbd>A</kbd>–<kbd>E</kbd></td><td>Answer a question</td></tr><tr><td><kbd>Enter</kbd></td><td>Next question</td></tr><tr><td><kbd>←</kbd> <kbd>→</kbd> <kbd>F</kbd></td><td>Practice exam: previous / next / flag</td></tr><tr><td><kbd>Space</kbd>, then <kbd>1</kbd>/<kbd>2</kbd></td><td>Flashcards: flip, then missed / got it</td></tr></table>'+
 '<h2>Your data</h2><p class="small">Progress is saved in this browser only'+(storageOK?'.':' — <b>but storage is currently blocked</b>, so export before closing the tab.')+' Export a backup file to move progress to another device.</p><p><button class="btn primary" id="ex">Export progress (JSON)</button><label class="btn">Import progress<input type="file" id="im" accept=".json,application/json" hidden></label><button class="btn" id="rs">Reset everything</button></p><textarea id="dump" hidden style="width:100%;height:8rem;font:12px monospace"></textarea>'+
 '<h2>Notes</h2><p class="small muted">All lessons, questions, and flashcards were written originally for this guide; none are copied from College Board or commercial prep materials. CLEP and College Board are trademarks of the College Board, which does not endorse this guide.</p>';
 $('#ex').onclick=()=>{const txt=JSON.stringify(S);try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='clep-sociology-progress-'+ymd(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();}catch(e){}const d=$('#dump');d.hidden=false;d.value=txt;d.select();};
 $('#im').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||o.v!==1)throw 0;S=Object.assign(fresh(),o);save();applyTheme();toast('Progress imported');route();}catch(err){alert('That file is not a valid progress export.');}};r.readAsText(f);};
 $('#rs').onclick=()=>{if(confirm('Erase all progress, scores, flashcard boxes and the mistake log?')){S=fresh();save();applyTheme();route();}};
}

window.__APP={QB,UNITS,CARDS,UNIT,QID,state:()=>S,examQs};
route();
})();
