lesson:`
<h3>The family: basic vocabulary</h3>
<p>The <b>family</b> is a social institution that unites people in cooperative groups to care for one another, including children. <b>Kinship</b> is a social bond based on blood, marriage, or adoption.</p>
<ul>
<li><b>Family of orientation</b> — the family you are born into. <b>Family of procreation</b> — the family you form through marriage or partnership and children.</li>
<li><b>Nuclear family</b> — one or two parents and their children. <b>Extended family</b> — parents, children, and other relatives such as grandparents living together or closely tied. Industrialization favored the nuclear family because it is small and mobile.</li>
</ul>
<p><b>Marriage patterns</b>:</p>
<ul>
<li><b>Monogamy</b> — one spouse at a time; the legal norm in the U.S. <b>Serial monogamy</b> — a sequence of spouses through divorce and remarriage.</li>
<li><b>Polygamy</b> — multiple spouses. <b>Polygyny</b> (one man, several wives) is the <b>most common</b> form and is permitted in many societies, though most men in those societies have one wife. <b>Polyandry</b> (one woman, several husbands, often brothers) is rare — found in parts of Tibet and Nepal.</li>
</ul>
<p><b>Mate selection</b>: <b>endogamy</b> is marriage within one's own group (race, religion, class); <b>exogamy</b> is marriage outside it. The <b>incest taboo</b> — forbidding sex and marriage between close relatives — is found in every society, which forces family members to form ties with other families. Most Americans practice <b>homogamy</b>, marrying people similar in age, education, class, race, and religion. <b>Propinquity</b> (being near each other) also shapes who meets whom. Many societies use <b>arranged marriages</b>; the U.S. emphasizes <b>romantic love</b>.</p>
<p><b>Residence</b> after marriage: <b>patrilocal</b> (with the husband's family), <b>matrilocal</b> (with the wife's family), or <b>neolocal</b> (a new home of their own — the U.S. norm).</p>
<p><b>Descent</b>: <b>patrilineal</b> (traced through the father's line), <b>matrilineal</b> (through the mother's line), or <b>bilateral</b> (through both — the U.S. pattern).</p>
<p><b>Authority</b>: <b>patriarchal</b> (men dominate), <b>matriarchal</b> (women dominate — no clear historical example), or <b>egalitarian</b> (shared equally — increasingly common in the U.S.).</p>

<h3>Theories of the family</h3>
<p><b>Functionalism</b>: the family performs vital tasks: (1) <b>socialization</b> of children; (2) <b>regulation of sexual activity</b> and reproduction; (3) <b>social placement</b> — children inherit a social position (class, race, religion); (4) <b>material and emotional security</b>. William <b>Ogburn</b> noted that industrial families lost many traditional functions (education, production, protection) to schools, factories, and government, leaving affection and companionship as the core.</p>
<p><b>Conflict and feminist theory</b>: the family <b>perpetuates inequality</b>. Inheritance passes wealth down generations, reproducing class. Friedrich Engels argued the family arose to let men pass property to their own sons, making women property. Feminists point to unequal housework (Hochschild's second shift) and domestic violence.</p>
<p><b>Symbolic interactionism</b>: studies how family members create meanings, roles, and intimacy in everyday interaction. <b>Social exchange theory</b> sees mate selection as weighing what each partner brings.</p>

<h3>Changing families</h3>
<ul>
<li>People marry <b>later</b> — the median age at first marriage is now about 30 for men and 28 for women.</li>
<li><b>Cohabitation</b> (living together unmarried) has become common, often before marriage.</li>
<li><b>Single-parent families</b>, most headed by mothers, have grown and face high poverty rates.</li>
<li><b>Blended families</b> combine children from previous relationships.</li>
<li><b>Dual-earner</b> couples are now the norm among married parents.</li>
<li><b>Same-sex marriage</b> became legal nationwide with <i>Obergefell v. Hodges</i> (2015).</li>
<li>Many adults stay <b>single</b> or <b>childfree</b>.</li>
</ul>
<p><b>Divorce</b> rose sharply from the 1960s to about 1980, then declined somewhat. Contributing factors: growing <b>individualism</b>, women's greater <b>economic independence</b>, reduced stigma, and <b>no-fault divorce</b> laws (California, 1969–1970). Divorce risk is higher for those who marry as teenagers, have low incomes, have a child before marriage, or whose parents divorced; it is lower for the college-educated and those who marry in their late twenties or later. Historian Stephanie <b>Coontz</b> (<i>The Way We Never Were</i>) argues the idealized 1950s family was historically unusual.</p>

<h3>Religion: the classic theories</h3>
<p><b>Religion</b> is a social institution involving beliefs and practices based on the sacred.</p>
<p><b>Émile Durkheim</b> (<i>The Elementary Forms of Religious Life</i>, 1912) divided the world into the <b>sacred</b> — things set apart as extraordinary, inspiring awe and reverence — and the <b>profane</b> — ordinary, everyday things. Studying Australian Aborigines, he argued that the <b>totem</b> symbolized the group itself: in worshipping the sacred, people are really worshipping <b>society</b>. Religion's functions: <b>social cohesion</b> (shared rituals unite people), <b>social control</b> (religious norms reinforce moral rules), and <b>meaning and purpose</b> in life.</p>
<p><b>Karl Marx</b>: religion is “the <b>opium of the people</b>.” It <b>legitimates inequality</b> (kings ruled by “divine right”) and soothes the oppressed with promises of reward in the afterlife, distracting them from changing their lives now — a source of false consciousness.</p>
<p><b>Max Weber</b>: religion can <b>drive social change</b>. In <i>The Protestant Ethic and the Spirit of Capitalism</i>, Calvinist beliefs encouraged disciplined work, saving, and reinvestment, helping capitalism grow. Weber also described <b>charismatic</b> leaders whose followers believe they have extraordinary qualities; after the leader dies, the movement survives through the <b>routinization of charisma</b> into rules and organization.</p>
<p><b>Symbolic interactionists</b> such as Peter Berger (<i>The Sacred Canopy</i>) see religion as a socially constructed system of meaning that makes the world feel orderly and secure.</p>

<h3>Types of religious organizations</h3>
<p>Weber and Ernst Troeltsch arranged religious groups on a <b>church–sect continuum</b>:</p>
<ul>
<li><b>Ecclesia</b> — a <b>state religion</b> to which nearly everyone belongs by birth (Islam in Saudi Arabia; historically the Church of England).</li>
<li><b>Denomination</b> — a church independent of the state that accepts <b>religious pluralism</b>; well integrated into society (Methodists, Presbyterians).</li>
<li><b>Sect</b> — a group that <b>breaks away</b> from an established religion, claiming to restore its true beliefs; stricter, more emotional, recruits through conversion, often led by a charismatic leader, and stands apart from society. Successful sects often become denominations over time.</li>
<li><b>Cult</b>, or <b>new religious movement</b> — a group largely <b>outside established religious traditions</b>, usually with a charismatic leader and new beliefs. (Christianity itself began as a cult in this technical sense.)</li>
</ul>
<p>Religions also differ by belief: <b>animism</b> (spirits in natural objects), <b>theism</b> (<b>monotheism</b> — one god, as in Judaism, Christianity, Islam; <b>polytheism</b> — many gods, as in Hinduism), and <b>ethical religions</b> based on moral principles (Buddhism, Confucianism). Christianity is the world's largest religion, followed by Islam.</p>

<h3>Religion in modern society</h3>
<ul>
<li><b>Secularization</b> — the declining influence of religion in public life as science and rational thought spread. The share of Americans with no religious affiliation (“<b>nones</b>”) has risen to more than a quarter of adults.</li>
<li><b>Fundamentalism</b> — a conservative reaction to secularization that insists on a <b>literal</b> reading of sacred texts and a return to traditional values.</li>
<li><b>Civil religion</b> (Robert <b>Bellah</b>) — quasi-religious loyalty to the nation, expressed in flags, anthems, the Pledge of Allegiance, “In God We Trust,” and national holidays.</li>
<li><b>Liberation theology</b> — a Latin American Catholic movement that uses religion to fight poverty and oppression, a modern example of religion promoting change.</li>
<li><b>Religiosity</b> — how important religion is in a person's life, measured by belief, ritual (attendance), experience, and knowledge.</li>
</ul>
`,

lesson:`
<h3>Education</h3>
<p><b>Education</b> is the institution through which a society formally transmits knowledge, skills, and values. The U.S. pioneered <b>mass education</b>, with compulsory schooling laws in every state by 1918.</p>
<p><b>Functionalist view.</b> Manifest functions: teaching knowledge and skills, <b>transmitting culture</b>, <b>social integration</b> (turning diverse people — such as immigrants — into citizens with shared values), and <b>social placement</b> (sorting students by talent and effort into suitable jobs). <b>Latent functions</b>: providing <b>child care</b>, keeping young people out of the job market, and creating social networks and marriage partners.</p>
<p><b>Conflict view.</b> Schools <b>reproduce inequality</b>:</p>
<ul>
<li><b>Tracking</b> — placing students in ability groups — tends to sort by class and race, and lower tracks receive less demanding instruction.</li>
<li><b>Unequal funding</b> — schools paid for by local property taxes give rich districts more money (Jonathan Kozol, <i>Savage Inequalities</i>, 1991).</li>
<li>The <b>hidden curriculum</b> teaches obedience and acceptance of authority. Samuel <b>Bowles and Herbert Gintis</b> (<i>Schooling in Capitalist America</i>, 1976) proposed the <b>correspondence principle</b>: the structure of schooling mirrors the workplace — working-class students are trained to follow orders, affluent students to lead.</li>
<li><b>Credentialism</b> (Randall <b>Collins</b>, <i>The Credential Society</i>, 1979): employers demand ever-higher degrees, often beyond what a job requires, which protects the advantages of those who can afford them.</li>
<li>Pierre <b>Bourdieu</b>'s <b>cultural capital</b>: the knowledge, tastes, and speech of the upper classes are rewarded in school as if they were merit.</li>
</ul>
<p><b>Symbolic interactionist view.</b> Robert <b>Rosenthal and Lenore Jacobson</b>'s “<b>Pygmalion in the Classroom</b>” (1968) told teachers that randomly chosen students were about to “bloom” intellectually; those students later showed larger IQ gains. Teacher <b>expectations</b> produced a <b>self-fulfilling prophecy</b>. Ray Rist found kindergarten teachers grouped children by appearance and class within days, and the groups persisted for years — a form of <b>labeling</b>.</p>
<p>The <b>Coleman Report</b> (James Coleman, 1966) surprised many by finding that students' <b>family background</b> and peers predicted achievement more strongly than school spending or facilities.</p>
<p>Current debates include school choice (<b>vouchers</b>, <b>charter schools</b>, homeschooling), standardized testing, and grade inflation.</p>

<h3>The economy</h3>
<p>The <b>economy</b> is the institution that organizes the production, distribution, and consumption of goods and services. Three revolutions transformed it: the <b>Agricultural Revolution</b>, the <b>Industrial Revolution</b> (factories, wage labor, specialization), and the <b>Information Revolution</b> that produced a <b>postindustrial</b> economy based on services and information (Daniel Bell).</p>
<p>Economic <b>sectors</b>:</p>
<ul>
<li><b>Primary</b> — extracting raw materials from nature (farming, fishing, mining). Dominant in low-income nations.</li>
<li><b>Secondary</b> — turning raw materials into manufactured goods. Dominant in industrializing nations.</li>
<li><b>Tertiary</b> — providing <b>services</b> (teaching, health care, retail, finance). Employs most workers in high-income nations like the U.S.</li>
</ul>
<p>Economic <b>systems</b>:</p>
<ul>
<li><b>Capitalism</b> — <b>private ownership</b> of property and businesses, pursuit of <b>profit</b>, and <b>free-market competition</b>; Adam Smith's “invisible hand” and <b>laissez-faire</b> (minimal government interference).</li>
<li><b>Socialism</b> — <b>collective ownership</b> of the means of production, pursuit of collective goals, and <b>government (central) planning</b>. <b>Communism</b>, in Marx's theory, is a classless society beyond socialism.</li>
<li>Mixed forms: <b>welfare capitalism</b> (market economy with extensive social programs — Sweden), and <b>state capitalism</b> (private companies closely guided by government).</li>
</ul>
<p>Large <b>corporations</b> dominate the U.S. economy. A <b>monopoly</b> is one company controlling a market; an <b>oligopoly</b> is a few companies doing so; <b>conglomerates</b> own many businesses in different industries; <b>interlocking directorates</b> link boards through shared members; <b>multinational corporations</b> operate across many countries. <b>Deindustrialization</b> (the decline of factory work), <b>outsourcing</b>, automation, the decline of <b>labor unions</b>, and growth in <b>contingent</b> (temporary, gig) work have reshaped jobs.</p>

<h3>Politics and government</h3>
<p><b>Power</b> is the ability to get one's way despite resistance (Unit 7). <b>Authority</b> is power that people see as <b>legitimate</b>. The <b>state</b>, Weber said, is the institution that successfully claims a <b>monopoly on the legitimate use of force</b> in a territory.</p>
<p>Weber's three types of authority:</p>
<ul>
<li><b>Traditional</b> — legitimate because of long-standing <b>custom</b> (hereditary kings, tribal chiefs).</li>
<li><b>Rational-legal</b> — legitimate because of <b>written rules and laws</b>; authority belongs to the <b>office</b>, not the person (a U.S. president, a judge, a bureaucrat). The dominant type in modern societies.</li>
<li><b>Charismatic</b> — legitimate because followers believe the leader has <b>extraordinary personal qualities</b> (Jesus, Gandhi, Martin Luther King Jr., Hitler). It is unstable and must be routinized to survive the leader (Unit 10).</li>
</ul>
<p>Political systems:</p>
<ul>
<li><b>Monarchy</b> — rule by one family, passed down generations; <b>absolute</b> or <b>constitutional</b> (today mostly symbolic, as in the UK).</li>
<li><b>Democracy</b> — power exercised by the people, usually through elected representatives (<b>representative democracy</b>).</li>
<li><b>Authoritarianism</b> — denies people participation in government but does not try to control every part of life (many military dictatorships).</li>
<li><b>Totalitarianism</b> — extensive government control of <b>nearly every aspect</b> of life, including media, economy, and private life, through surveillance and propaganda (Nazi Germany, Stalin's USSR, North Korea).</li>
</ul>
<p>In the U.S., two major parties dominate; <b>interest groups</b> and <b>political action committees (PACs)</b> raise money and lobby. <b>Voter turnout</b> is low compared with many democracies and is highest among people who are <b>older, more educated, and higher-income</b>. The <b>family</b> is the most important agent of political socialization (most people adopt their parents' party). Who really rules is debated: the <b>pluralist</b> model (Dahl) vs. the <b>power-elite</b> model (Mills) — see Unit 7. President Eisenhower warned of a <b>military-industrial complex</b>, the close ties between the armed forces and defense industries.</p>

<h3>Health and medicine</h3>
<p>The World Health Organization defines <b>health</b> as complete physical, mental, and social well-being, not merely the absence of disease. <b>Social epidemiology</b> studies how health and disease are <b>distributed</b> across a population by class, race, sex, and age. Health follows the class ladder: people with more income and education live longer and healthier lives. In the U.S., women live longer than men. The <b>infant mortality rate</b> — deaths of infants under one year old per 1,000 live births — is a key indicator of a society's health, and it is higher in the U.S. than in most other rich nations. As societies develop, leading causes of death shift from infectious diseases to chronic diseases such as heart disease and cancer (the <b>epidemiological transition</b>).</p>
<p><b>Functionalist view — the sick role</b> (Talcott <b>Parsons</b>, 1951): illness is a form of deviance that disrupts society, so society defines a <b>sick role</b> with rights and duties. The sick person (1) is <b>exempt</b> from normal responsibilities and (2) is <b>not blamed</b> for being ill, but (3) must <b>want to get well</b> and (4) must <b>seek competent help</b> and cooperate with medical professionals.</p>
<p><b>Conflict view</b>: access to care is unequal; the profit motive drives over-treatment of some and neglect of others; physicians historically gained great power and monopolized medical knowledge (Paul Starr, <i>The Social Transformation of American Medicine</i>). <b>Medicalization</b> (Peter Conrad) expands medical control by redefining ordinary or moral problems — childbirth, hyperactivity, alcoholism, aging — as illnesses to be treated by doctors.</p>
<p><b>Symbolic interactionist view</b>: health and illness are partly <b>socially constructed</b>; what counts as sick varies across cultures, and labels like “mentally ill” shape how people are treated (Thomas Szasz called mental illness a “myth”).</p>
<p><b>Health care systems</b>:</p>
<ul>
<li><b>Socialized medicine</b> — the government <b>owns the facilities and employs the physicians</b> (Britain's National Health Service).</li>
<li><b>National health insurance / single payer</b> — the government <b>pays</b> for care, but doctors and hospitals are largely private (Canada).</li>
<li><b>United States</b> — mostly <b>private</b>, employer-based insurance, plus government programs created in 1965: <b>Medicare</b> for people 65 and older and <b>Medicaid</b> for low-income people. The <b>Affordable Care Act</b> (2010) expanded coverage. The U.S. spends more per person on health care than any other nation, yet its life expectancy trails many rich countries.</li>
</ul>
`,

lesson:`
<h3>Demography: the science of population</h3>
<p><b>Demography</b> is the study of the size, composition, distribution, and change of human populations. Populations change through three processes: <b>fertility</b> (births), <b>mortality</b> (deaths), and <b>migration</b> (movement).</p>

<h3>The key measures</h3>
<ul>
<li><b>Fertility</b> is the actual number of births; <b>fecundity</b> is the maximum possible, biologically.</li>
<li><b>Crude birth rate (CBR)</b> — live births per <b>1,000 people</b> in a year. “Crude” because it is based on the whole population, not just women of childbearing age.</li>
<li><b>Crude death rate (CDR)</b> — deaths per 1,000 people in a year.</li>
<li><b>Total fertility rate (TFR)</b> — the average number of children a woman would have in her lifetime. <b>Replacement level</b> is about <b>2.1</b>; sustained fertility below that (without immigration) eventually shrinks a population. The U.S. TFR is below replacement.</li>
<li><b>Life expectancy</b> — average years a newborn can expect to live. <b>Infant mortality rate</b> — infant deaths per 1,000 live births (Unit 11).</li>
<li><b>Net migration rate</b> — (immigrants − emigrants) per 1,000 people. <b>Immigration</b> = moving <i>into</i> a country; <b>emigration</b> = leaving one. <b>Internal migration</b> is movement within a country.</li>
<li><b>Rate of natural increase</b> = CBR − CDR. Divide by 10 to convert “per 1,000” into a percentage.</li>
<li><b>Growth rate</b> = natural increase + net migration.</li>
<li><b>Doubling time</b> ≈ 70 ÷ annual growth rate in percent (the “rule of 70”).</li>
<li><b>Sex ratio</b> = number of males per 100 females.</li>
<li><b>Dependency ratio</b> = people of dependent ages (under 15 and 65+) per 100 people of working age (15–64).</li>
</ul>
<div class="ex">A country has a CBR of 30 and a CDR of 10 per 1,000, with no migration. Natural increase = 20 per 1,000 = 2% a year. Doubling time ≈ 70 ÷ 2 = 35 years.</div>
<p>Migration has <b>push factors</b> (poverty, war, persecution, disaster) that drive people out and <b>pull factors</b> (jobs, freedom, family, a better climate) that attract them. In the U.S., internal migration since the mid-20th century has flowed from the Northeast and Midwest (“Snow Belt” or “Rust Belt”) to the South and West (“<b>Sun Belt</b>”).</p>

<h3>Population pyramids</h3>
<p>A <b>population pyramid</b> is a bar graph of a population by age and sex — males on one side, females on the other, youngest at the bottom. A <b>wide base</b> (expansive pyramid) means high fertility and a young population, typical of low-income nations. A <b>narrow base and wide top</b> (constrictive pyramid) means low fertility and an <b>aging</b> population, typical of Japan, Italy, and increasingly the U.S. Bulges show events like a baby boom.</p>

<h3>Theories of population</h3>
<p><b>Thomas Robert Malthus</b> (<i>An Essay on the Principle of Population</i>, 1798) warned that population grows <b>geometrically</b> (1, 2, 4, 8, 16) while food supply grows only <b>arithmetically</b> (1, 2, 3, 4, 5). Unless people practice “preventive checks” such as late marriage and abstinence, “positive checks” — <b>famine, war, and disease</b> — will raise death rates. Malthus underestimated technology's ability to raise food production and did not foresee birth control's spread. <b>Neo-Malthusians</b> such as Paul <b>Ehrlich</b> (<i>The Population Bomb</i>, 1968) renewed the warnings. World population passed <b>8 billion</b> in 2022.</p>
<p><b>Demographic transition theory</b> links population change to economic development:</p>
<ol>
<li><b>Stage 1 — preindustrial</b>: high birth rates <b>and</b> high death rates; little growth.</li>
<li><b>Stage 2 — early industrial</b>: death rates <b>fall</b> (better food, sanitation, medicine) while birth rates stay high — <b>rapid population growth</b>. Many low-income nations have been in this stage.</li>
<li><b>Stage 3 — mature industrial</b>: birth rates fall too (children become an economic cost; contraception; women's education); growth slows.</li>
<li><b>Stage 4 — postindustrial</b>: low birth and low death rates; little or no growth. Some nations have moved to below-replacement fertility and population decline.</li>
</ol>
<p><b>Zero population growth</b> is the level of reproduction that keeps population steady.</p>

<h3>Community: from village to city</h3>
<p>A <b>community</b> is a group of people who share a territory and a sense of belonging. Early sociologists asked what is lost when people move from villages to cities.</p>
<p>Ferdinand <b>Tönnies</b> (1887) contrasted <b>Gemeinschaft</b> (“community”) — small, traditional settings where people are bound by <b>kinship, tradition, and personal ties</b> — with <b>Gesellschaft</b> (“society” or “association”) — large urban settings where relationships are <b>impersonal</b>, based on <b>self-interest</b>, contracts, and specialized roles. (Compare Durkheim's mechanical and organic solidarity, Unit 1.) Robert Redfield described a similar <b>folk–urban continuum</b>.</p>
<p>Louis <b>Wirth</b> (“Urbanism as a Way of Life,” 1938) argued that three features of cities — large <b>size</b>, high <b>density</b>, and social <b>heterogeneity</b> (diversity) — produce impersonal, superficial, <b>secondary</b> relationships, along with tolerance and anonymity. Georg Simmel described the city dweller's “blasé attitude.”</p>
<p>Not everyone agreed cities destroy community. Herbert <b>Gans</b> (<i>The Urban Villagers</i>, 1962) found that Italian Americans in Boston's West End had tight-knit neighborhoods — “<b>urban villagers</b>.” He also identified other urban types: cosmopolites, singles, “the deprived,” and “the trapped.” Robert and Helen <b>Lynd</b>'s <i>Middletown</i> (1929), a study of Muncie, Indiana, is the classic community study of a typical American town.</p>

<h3>Human ecology: how cities are arranged</h3>
<p><b>Human ecology</b> — developed by Robert <b>Park</b> and Ernest <b>Burgess</b> at the University of Chicago — studies the relationship between people and their physical environment, borrowing ideas from plant and animal ecology. Key processes: <b>concentration</b>, <b>segregation</b>, and <b>invasion and succession</b> (a new group or land use moves into an area and eventually replaces the old one).</p>
<ul>
<li><b>Concentric zone model</b> (Burgess, 1925): the city grows in <b>rings</b> — the central business district at the core, then a “zone in transition” (poor, immigrant, high-crime), then working-class homes, then middle-class residences, then a commuter zone.</li>
<li><b>Sector model</b> (Homer <b>Hoyt</b>, 1939): neighborhoods form <b>wedge-shaped sectors</b> radiating out along transportation routes (a wealthy wedge, an industrial wedge along a rail line).</li>
<li><b>Multiple nuclei model</b> (Chauncy <b>Harris and Edward Ullman</b>, 1945): a city has <b>several centers</b> (downtown, an airport, a university, a shopping district), each attracting related activities.</li>
</ul>
<p>Conflict theorists criticize human ecology for treating city growth as natural. The <b>urban political economy</b> approach (John Logan and Harvey Molotch's “<b>growth machine</b>”) shows that developers, banks, and politicians shape cities to profit from land.</p>

<h3>Urbanization and rural patterns</h3>
<p><b>Urbanization</b> is the concentration of population in cities. The first cities arose roughly 10,000 years ago, but most people lived in rural areas until the industrial era. Since about 2007–2008, <b>more than half of the world's population</b> has lived in urban areas; about four in five Americans live in urban areas.</p>
<ul>
<li>A <b>metropolis</b> is a large city that dominates a region socially and economically. A <b>megalopolis</b> (Jean <b>Gottmann</b>) is a continuous chain of metropolitan areas, such as the Boston-to-Washington corridor. A <b>megacity</b> has 10 million or more people.</li>
<li><b>Suburbanization</b> boomed after World War II, encouraged by highways, cars, and mortgage programs (Levittown). Many middle-class whites left central cities (“<b>white flight</b>”), shrinking city tax bases.</li>
<li><b>Edge cities</b> (Joel Garreau) are business and shopping centers that grow up at suburban highway interchanges.</li>
<li><b>Gentrification</b> is the movement of middle- and upper-income people into poorer urban neighborhoods, raising property values and often displacing longtime residents.</li>
<li><b>Urban sprawl</b> is low-density development spreading out from cities.</li>
<li><b>Rural</b> America has lost population share; family farms have given way to large <b>agribusiness</b>, and many rural areas face aging populations and fewer services.</li>
</ul>
<p>Environmental issues are linked to population and urbanization: Garrett Hardin's “<b>tragedy of the commons</b>” describes how individuals acting in self-interest deplete shared resources, and <b>environmental racism</b> refers to the placement of polluting facilities in poor and minority communities.</p>

Q("u5","d","E","Getting a tattoo was widely considered deviant in mainstream U.S. culture a few generations ago but is common today. This shows that deviance is",

function load(){try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&o.v===1)return Object.assign(fresh(),o);}}catch(e){storageOK=false;}return fresh();}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true;}catch(e){storageOK=false;}}
function us(id){return S.units[id]||(S.units[id]={read:false,best:null,last:null,attempts:0});}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

/* ---------- theme ---------- */
function applyTheme(){const dark=S.theme?S.theme==='dark':(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';const b=document.getElementById('themeBtn');if(b)b.textContent=dark?'Light':'Dark';}
applyTheme();
$('#themeBtn').onclick=()=>{S.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';save();applyTheme();};
$('#menuBtn').onclick=()=>document.body.classList.toggle('navopen');

/* ---------- derived progress ---------- */
function diagTag(id){if(!S.diag||!S.diag.res[id])return null;const[c,t]=S.diag.res[id];return t&&c/t>=0.67?'skim':'study';}
function unitDone(id){const s=S.units[id];return !!(s&&s.read&&s.best!=null&&s.best>=70);}
function cardsLearned(u){return u.cards.filter(c=>S.cards[c.id]&&S.cards[c.id].box>=3).length;}
function unitFactor(u){return diagTag(u.id)==='skim'?0.6:1;}
function lastExam(k){const e=S.exams[k];return e&&e.attempts&&e.attempts.length?e.attempts[e.attempts.length-1]:null;}
function tasksRemaining(){
 const t=[];
 if(!S.diag)t.push({l:'Diagnostic test ('+QB.filter(q=>q.s==='d').length+' questions)',m:40,href:'#/diag'});
 UNITS.forEach(u=>{const s=S.units[u.id]||{},f=unitFactor(u);
  if(!s.read)t.push({l:u.short+' lesson + must-know: '+u.title,m:Math.round(((u.minutes||15)+6)*f),href:'#/unit/'+u.id,u:u.id});
  if(!(s.best>=70))t.push({l:u.short+' quiz ('+u.qs.length+' Qs) + read every explanation',m:Math.round(u.qs.length*1.6*f)+4,href:'#/quiz/'+u.id,u:u.id});
  const left=u.cards.length-cardsLearned(u);
  if(left>0)t.push({l:u.short+' flashcards ('+left+' not yet in box 3+)',m:Math.max(5,Math.round(left*0.7*f)),href:'#/cards/'+u.id,u:u.id,cards:1});
 });
 return t;
}
function hoursLeft(){
 let m=tasksRemaining().reduce((a,b)=>a+b.m,0);
 const mist=Object.values(S.mistakes).filter(x=>x.streak<2).length;m+=mist*1.5;
 ['a','b'].forEach(k=>{const e=lastExam(k);if(!e)m+=150;else if(e.score<75)m+=60;});
 if(!S.cheatDone)m+=45;
 // spaced-repetition reviews still to come: ~15 s per remaining Leitner promotion
 m+=CARDS.reduce((a,c)=>a+(5-(S.cards[c.id]?S.cards[c.id].box:0))*0.25,0);
 return Math.max(0,m/60);
}
function readiness(){
 const ea=lastExam('a'),eb=lastExam('b');
 const unitsFrac=UNITS.length?UNITS.filter(u=>unitDone(u.id)).length/UNITS.length:0;
 const p=0.1*(S.diag?1:0)+0.4*unitsFrac+0.25*Math.min(1,(ea?ea.score:0)/75)+0.25*Math.min(1,(eb?eb.score:0)/75);
 const ready=!!(ea&&eb&&ea.score>=75&&eb.score>=75);
 return{p:Math.round(p*100),ready,ea,eb,unitsFrac};
}

 });
 h+='<div class="sec">Practice</div><a href="#/cards" data-r="cards">Flashcards</a><a href="#/mistakes" data-r="mistakes">Mistake log<span class="mk">'+(Object.values(S.mistakes).filter(x=>x.streak<2).length||'')+'</span></a><a href="#/exam" data-r="exam">Practice exams</a>';

 $('#nav').innerHTML=h;

/* ---------- shared render helpers ---------- */
function hbar(label,c,t){const p=pct(c,t);return'<div class="hbar"><span class="lbl" title="'+esc(label)+'">'+esc(label)+'</span><span class="trk"><i style="width:'+p+'%;background:'+(p>=75?'var(--ok)':p>=60?'var(--accent)':'var(--bad)')+'"></i></span><span class="val">'+c+'/'+t+' · '+p+'%</span></div>';}
function tagChip(id){const t=diagTag(id);return t==='skim'?'<span class="chip ok">Skim</span>':t==='study'?'<span class="chip bad">Must study</span>':'';}
function optHTML(q,showDiff){
 return'<div class="qmeta">'+(showDiff?UNIT[q.u].short+' · '+esc(UNIT[q.u].title)+' · '+DIFF[q.d]:'')+'</div><div class="stem" data-qid="'+q.id+'">'+q.q+'</div><ol class="opts">'+q.opts.map((o,i)=>'<li><button class="opt" data-i="'+i+'"><span class="key">'+LETTERS[i]+'</span><span>'+o.t+'</span></button><div class="why" hidden></div></li>').join('')+'</ol>';
}
function reveal(root,q,chosen){
 $$('.opt',root).forEach((b,i)=>{const o=q.opts[i];b.classList.add('locked');if(o.ok)b.classList.add('right');else if(i===chosen)b.classList.add('wrong');
  const w=b.nextElementSibling;w.hidden=false;w.innerHTML=(o.ok?'<b class="g">✓ Why this is right:</b> ':'<b class="r">✗ Why this is wrong:</b> ')+o.e;});
}
function reviewHTML(q,chosen){
 return'<details class="rev"><summary>'+(chosen!=null&&q.opts[chosen]&&q.opts[chosen].ok?'✓':'✗')+' <span class="small muted">'+UNIT[q.u].short+'</span> '+esc(strip(q.q).slice(0,140))+(strip(q.q).length>140?'…':'')+'</summary><div class="stem">'+q.q+'</div><ol class="opts">'+q.opts.map((o,i)=>'<li><div class="opt locked '+(o.ok?'right':i===chosen?'wrong':'')+'"><span class="key">'+LETTERS[i]+'</span><span>'+o.t+(i===chosen?' <span class="chip">your answer</span>':'')+'</span></div><div class="why">'+(o.ok?'<b class="g">✓ Right:</b> ':'<b class="r">✗ Wrong:</b> ')+o.e+'</div></li>').join('')+'</ol>'+(chosen==null?'<p class="small muted">Not answered.</p>':'')+'</details>';
}
function addMistake(id,src){const m=S.mistakes[id]||(S.mistakes[id]={n:0,streak:0,src});m.n++;m.streak=0;m.t=Date.now();}
function byUnit(res){const o={};res.forEach(r=>{const k=r.q.u;o[k]=o[k]||[0,0];o[k][1]++;if(r.ok)o[k][0]++;});return o;}
function byArea(res){const o={};res.forEach(r=>{const k=UNIT[r.q.u].area;o[k]=o[k]||[0,0];o[k][1]++;if(r.ok)o[k][0]++;});return o;}

/* ---------- generic question runner (quiz / diagnostic / drill) ---------- */
function runner({qs,mode,title,back,onFinish}){
 let i=0,chosen=null,locked=false;const res=[];
 function draw(){
  const q=qs[i];chosen=null;locked=false;
  V().innerHTML='<div class="runner"><div class="rhead"><a href="'+back+'">← Exit</a><span>'+esc(title)+'</span><span>'+(i+1)+' / '+qs.length+'</span></div><div class="bar"><i style="width:'+pct(i,qs.length)+'%"></i></div>'+
   optHTML(q,mode!=='diag')+'<div class="ractions"><button id="nx" class="btn primary" disabled>'+(mode==='diag'?(i<qs.length-1?'Next →':'Finish'):'Choose an answer')+'</button>'+(mode==='diag'?'<button id="skip" class="btn">I don\'t know</button>':'')+'</div>'+
   '<p class="hint"><kbd>1</kbd>–<kbd>5</kbd> or <kbd>A</kbd>–<kbd>E</kbd> to answer · <kbd>Enter</kbd> for next</p></div>';
  $$('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  $('#nx').onclick=next;
  if($('#skip'))$('#skip').onclick=()=>{record(null);};
 }
 function record(k){const q=qs[i];const ok=k!=null&&q.opts[k].ok;res.push({q,choice:k,ok});if(!ok)addMistake(q.id,mode);else if(mode==='drill'&&S.mistakes[q.id]){S.mistakes[q.id].streak++;}save();i++;if(i>=qs.length)onFinish(res);else draw();}
 function pick(k){
  if(locked)return;chosen=k;
  if(mode==='diag'){$$('.opt').forEach((b,j)=>b.classList.toggle('sel',j===k));$('#nx').disabled=false;return;}
  locked=true;reveal(V(),qs[i],k);const nx=$('#nx');nx.disabled=false;nx.textContent=i<qs.length-1?'Next →':'See results';
 }
 function next(){if(mode==='diag'){if(chosen==null)return;record(chosen);}else{if(!locked)return;record(chosen);}}
 keyHandler=e=>{const k=e.key.toLowerCase();if(/^[1-5]$/.test(k))pick(+k-1);else if(/^[a-e]$/.test(k))pick(LETTERS.toLowerCase().indexOf(k));else if(k==='enter'){e.preventDefault();next();}};
 draw();
}
function resultsHTML(res,title,extra){
 const c=res.filter(r=>r.ok).length,bu=byUnit(res);
 return'<h1>'+esc(title)+' — results</h1><div class="grid"><div class="stat"><b>'+pct(c,res.length)+'%</b><span>'+c+' of '+res.length+' correct</span></div></div>'+(extra||'')+
  '<h2>By unit</h2>'+UNITS.filter(u=>bu[u.id]).map(u=>hbar(u.short+' '+u.title,bu[u.id][0],bu[u.id][1])).join('')+
  '<h2>Review</h2><p class="muted small">Missed questions were added to your <a href="#/mistakes">mistake log</a>.</p>'+res.map(r=>reviewHTML(r.q,r.choice)).join('');
}

 const qs=QB.filter(q=>q.s==='d');
 if(!qs.length){V().innerHTML='<h1>Diagnostic test</h1><p class="muted">Diagnostic questions have not been added yet.</p>';return;}
 const start=()=>runner({qs:shuffle(qs,rng(hash('diag'))),mode:'diag',title:'Diagnostic',back:'#/diag',onFinish:res=>{
  const r={};UNITS.forEach(u=>r[u.id]=[0,0]);res.forEach(x=>{r[x.q.u][1]++;if(x.ok)r[x.q.u][0]++;});
  S.diag={date:Date.now(),res:r,score:pct(res.filter(x=>x.ok).length,res.length),ans:Object.fromEntries(res.map(x=>[x.q.id,x.choice]))};save();drawNav();
  V().innerHTML=diagSummary()+'<h2>Review</h2>'+res.map(x=>reviewHTML(x.q,x.choice)).join('');window.scrollTo(0,0);}});
 if(S.diag){V().innerHTML=diagSummary()+'<p><button class="btn" id="re">Retake diagnostic</button></p>'+
  '<h2>Review</h2>'+qs.map(q=>reviewHTML(q,S.diag.ans?S.diag.ans[q.id]:null)).join('');$('#re').onclick=start;return;}
 V().innerHTML='<h1>Diagnostic test</h1><div class="card"><p><b>'+qs.length+' questions</b> spanning every unit in proportion to the official weights. No feedback until the end — answer honestly and use <b>I don\'t know</b> instead of guessing, so the results are accurate.</p><p>Afterward each unit is marked <span class="chip ok">Skim</span> (you got at least two-thirds right) or <span class="chip bad">Must study</span>. Your study plan and hours estimate adjust automatically.</p><button class="btn primary" id="go">Start diagnostic</button><p class="hint">Takes about 25–40 minutes.</p></div>';

}

/* ---------- flashcards (Leitner) ---------- */
const INTERVAL=[0,0,1,3,7,16]; // days until due, by box 1..5
function cs(id){return S.cards[id];}
function unlocked(c){const s=S.units[c.u];return !!(s&&s.read)||!!(S.diag&&S.diag.res[c.u]);}
function dueCards(unit){const now=Date.now();return CARDS.filter(c=>(!unit||c.u===unit)&&cs(c.id)&&cs(c.id).due<=now);}
function newCards(unit){return CARDS.filter(c=>(!unit||c.u===unit)&&!cs(c.id)&&(unit||unlocked(c)));}
function missedCards(unit){return CARDS.filter(c=>(!unit||c.u===unit)&&cs(c.id)&&cs(c.id).miss);}
function viewCards(unit){
 const u=unit&&UNIT[unit];
 const box=[0,0,0,0,0,0];CARDS.filter(c=>!u||c.u===unit).forEach(c=>{const s=cs(c.id);box[s?s.box:0]++;});
 const due=dueCards(unit),nw=newCards(unit),ms=missedCards(unit);
 V().innerHTML='<h1>Flashcards'+(u?' — '+u.short+' '+esc(u.title):'')+'</h1><p class="muted">Leitner boxes: a card you get right moves up a box and comes back later (box 2: 1 day, 3: 3 days, 4: 7 days, 5: 16 days). A card you miss drops to box 1 and returns in the same session.</p>'+
 '<div class="boxes"><span><b>'+box[0]+'</b>new</span>'+[1,2,3,4,5].map(i=>'<span><b>'+box[i]+'</b>box '+i+'</span>').join('')+'</div>'+

function cardSession(list,unit){
 let q=shuffle(list),flipped=false,right=0,wrong=0;const back='#/cards'+(unit?'/'+unit:'');
 function draw(){
  if(!q.length){S.cardSessions++;save();V().innerHTML='<h1>Session done</h1><p>'+right+' right, '+wrong+' missed (missed cards were repeated until you got them).</p><a class="btn primary" href="'+back+'">Back to decks</a>';keyHandler=null;return;}
  const c=q[0],s=cs(c.id);flipped=false;
  V().innerHTML='<div class="rhead runner"><div class="rhead"><a href="'+back+'">← Exit</a><span>'+q.length+' left</span><span>'+UNIT[c.u].short+(s?' · box '+s.box:' · new')+'</span></div></div>'+
  '<div class="fc" id="fc"><div><div>'+esc(c.f)+'</div><div class="back" id="bk" hidden>'+c.b+'</div><div class="hint" id="fh">Click or press <kbd>Space</kbd> to flip</div></div></div>'+
  '<div class="ractions" id="ra" hidden><button class="btn" id="no">✗ Missed <kbd>1</kbd></button><button class="btn primary" id="yes">✓ Got it <kbd>2</kbd></button></div>';
  $('#fc').onclick=flip;$('#no').onclick=()=>grade(false);$('#yes').onclick=()=>grade(true);
 }
 function flip(){if(flipped)return;flipped=true;$('#bk').hidden=false;$('#fh').hidden=true;$('#ra').hidden=false;}
 function grade(ok){
  if(!flipped)return;const c=q.shift();const s=S.cards[c.id]||(S.cards[c.id]={box:0,due:0,miss:false,n:0,lapses:0});s.n++;
  if(ok){right++;s.box=Math.min(5,Math.max(1,s.box)+1);s.due=Date.now()+INTERVAL[s.box]*DAY;if(s.box>=3)s.miss=false;}
  else{wrong++;s.box=1;s.due=Date.now();s.miss=true;s.lapses++;q.splice(Math.min(3,q.length),0,c);}
  save();draw();
 }
 keyHandler=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}else if(e.key==='1'||e.key==='ArrowLeft')grade(false);else if(e.key==='2'||e.key==='ArrowRight')grade(true);};
 draw();
}

/* ---------- study plan ---------- */
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseYmd(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function makePlan(hpd,examStr){
 const today=new Date();today.setHours(0,0,0,0);const exam=parseYmd(examStr);
 const n=Math.round((exam-today)/DAY);if(!(n>=1))return{err:'Pick an exam date after today.'};
 const cap=Math.round(hpd*60),days=[];for(let i=0;i<n;i++)days.push({d:new Date(today.getTime()+i*DAY),items:[],used:0});
 const add=(day,l,m,href,cls)=>{day.items.push({l,m,href,cls});day.used+=m;};
 // reserve practice exams for the final 1–2 days
 const needA=!lastExam('a'),needB=!lastExam('b');
 const dB=days[n-1],dA=n>=2?days[n-2]:days[n-1];
 if(needA)add(dA,'Practice Exam 1 — 100 Qs, 90 min, timed',90,'#/exam/a','exam');
 if(needA)add(dA,'Review every Exam 1 miss, then drill the mistake log',45,'#/mistakes','exam');
 if(needB)add(dB,'Practice Exam 2 — 100 Qs, 90 min, timed',90,'#/exam/b','exam');
 add(dB,'Cheat sheet: redraw from memory; review weakest unit\'s must-know box',30,'#/cheat','exam');
 const studyDays=days.filter(d=>d!==dA&&d!==dB);
 const tasks=tasksRemaining().filter(t=>!t.cards).map(t=>Object.assign({},t));
 // weave each unit's flashcard first pass right after its quiz
 const cardT=tasksRemaining().filter(t=>t.cards);
 const ordered=[];tasks.forEach(t=>{ordered.push(t);if(/quiz/.test(t.l)){const c=cardT.find(x=>x.u===t.u);if(c){ordered.push(c);cardT.splice(cardT.indexOf(c),1);}}});
 cardT.forEach(c=>ordered.push(c));
 ordered.push({l:'Mistake-log drill (until queue is under 10)',m:40,href:'#/mistakes'});
 const review=cap>=60?15:10;
 let ti=0,rem=ordered.length?ordered[0].m:0,part=1;
 studyDays.forEach((day,idx)=>{
  if(idx>0)add(day,'Flashcards: due cards + missed',review,'#/cards');
  while(ti<ordered.length&&day.used<cap){
   const t=ordered[ti],room=cap-day.used;
   if(room<10&&day.items.length)break;
   if(rem<=room){add(day,t.l+(part>1?' (finish)':''),rem,t.href);ti++;rem=ti<ordered.length?ordered[ti].m:0;part=1;}
   else{add(day,t.l+' (part '+part+')',room,t.href);rem-=room;part++;}
  }
  if(ti>=ordered.length&&day.used<cap-20){add(day,'Retake your lowest-scoring unit quiz + mistake drill',Math.min(45,cap-day.used),'#/mistakes');}
 });
 const left=ti<ordered.length?ordered.slice(ti).reduce((a,t,j)=>a+(j===0?rem:t.m),0):0;
 const need=(ordered.reduce((a,t)=>a+t.m,0)+studyDays.length*review)/Math.max(1,studyDays.length)/60;
 return{days,exam,left,need:Math.ceil(need*4)/4,n};
}

 V().innerHTML='<h1>Study plan</h1><p class="muted">Enter your daily hours and exam date. The plan follows the unit order, gives “Skim” units (from the diagnostic) about 40% less time, schedules flashcard review every day, and puts the two practice exams in the last 1–2 days before your exam. It updates as you complete work — regenerate any time.</p>'+
 '<div class="card noprint"><label class="f">Hours per day<input type="number" id="hp" min="0.5" max="10" step="0.25" value="'+p.hpd+'"></label><label class="f">Exam date<input type="date" id="dt" value="'+p.date+'"></label><button class="btn primary" id="mk">Generate plan</button><button class="btn" id="pp">Print</button><p class="small muted">Estimated work remaining: ~'+hoursLeft().toFixed(1)+' hours.</p></div><div id="out"></div>';

  '<div class="tablewrap"><table class="plan"><tr><th>Day</th><th>Tasks</th><th>Time</th></tr>'+r.days.map((d,i)=>'<tr class="'+(d.items.some(x=>x.cls==='exam')?'exam':'')+'"><td>'+fmtD(d.d)+'<br><span class="small muted">Day '+(i+1)+'</span></td><td><ul>'+(d.items.length?d.items.map(x=>'<li>'+(x.href?'<a href="'+x.href+'">'+esc(x.l)+'</a>':esc(x.l))+' <span class="muted small">'+x.m+'m</span></li>').join(''):'<li class="muted">Rest / light flashcards</li>')+'</ul></td><td>'+(d.used/60).toFixed(1)+'h</td></tr>').join('')+
  '<tr class="exam"><td>'+fmtD(r.exam)+'</td><td><b>EXAM DAY.</b> 10 minutes of flashcards at most. Bring ID; arrive early.</td><td></td></tr></table></div>';

 '<p class="small">Source: College Board, <a href="'+OUTLINE.url+'" target="_blank" rel="noopener">CLEP Introductory Sociology exam page</a> and the <a href="'+OUTLINE.glanceUrl+'" target="_blank" rel="noopener">“At a Glance” sheet</a>; retrieved '+OUTLINE.retrieved+'. The College Board site could not be loaded directly while this guide was built, so figures were confirmed from search extracts of those pages. Items that could not be confirmed are marked '+uv+'.</p></div>'+
 '<h2>Official content outline</h2><div class="tablewrap"><table><tr><th>Area</th><th>Weight</th><th>Subtopics</th><th>Units here</th></tr>'+OUTLINE.areas.map(a=>'<tr><td>'+esc(a.name)+'</td><td>'+a.weight+'%</td><td>'+a.sub.map(esc).join(', ')+(a.subVerified?'':' '+uv)+'</td><td>'+UNITS.filter(u=>u.area===a.id).map(u=>u.short).join(', ')+'</td></tr>').join('')+'</table></div>'+
 '<h3>Skills tested</h3><ul>'+OUTLINE.skills.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul><p class="small muted">The official page does not give a percentage for each skill, so none is shown.</p>'+
 '<h2>Content budget vs. official weights</h2><div class="tablewrap"><table><tr><th>Unit</th><th>Weight</th><th>Lesson words</th><th>Questions (quiz/diag/ex1/ex2)</th><th>Cards</th></tr>'+UNITS.map(u=>{const c=s=>QB.filter(q=>q.u===u.id&&q.s===s).length,t=QB.filter(q=>q.u===u.id).length;return'<tr><td>'+u.short+' '+esc(u.title)+'</td><td>'+u.weight+'%</td><td>'+words(u)+' ('+pct(words(u),totW)+'%)</td><td>'+t+' ('+pct(t,totQ)+'%) · '+c('q')+'/'+c('d')+'/'+c('a')+'/'+c('b')+'</td><td>'+u.cards.length+' ('+pct(u.cards.length,totC)+'%)</td></tr>';}).join('')+'<tr><th>Total</th><th>100%</th><th>'+totW+'</th><th>'+totQ+'</th><th>'+totC+'</th></tr></table></div>'+
 '<h2>Keyboard shortcuts</h2><table><tr><td><kbd>1</kbd>–<kbd>5</kbd> or <kbd>A</kbd>–<kbd>E</kbd></td><td>Answer a question</td></tr><tr><td><kbd>Enter</kbd></td><td>Next question</td></tr><tr><td><kbd>←</kbd> <kbd>→</kbd> <kbd>F</kbd></td><td>Practice exam: previous / next / flag</td></tr><tr><td><kbd>Space</kbd>, then <kbd>1</kbd>/<kbd>2</kbd></td><td>Flashcards: flip, then missed / got it</td></tr></table>'+
 '<h2>Your data</h2><p class="small">Progress is saved in this browser only'+(storageOK?'.':' — <b>but storage is currently blocked</b>, so export before closing the tab.')+' Export a backup file to move progress to another device.</p><p><button class="btn primary" id="ex">Export progress (JSON)</button><label class="btn">Import progress<input type="file" id="im" accept=".json,application/json" hidden></label><button class="btn" id="rs">Reset everything</button></p><textarea id="dump" hidden style="width:100%;height:8rem;font:12px monospace"></textarea>'+
 '<h2>Notes</h2><p class="small muted">All lessons, questions, and flashcards were written originally for this guide; none are copied from College Board or commercial prep materials. CLEP and College Board are trademarks of the College Board, which does not endorse this guide.</p>';
 $('#ex').onclick=()=>{const txt=JSON.stringify(S);try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='clep-sociology-progress-'+ymd(new Date())+'.json';document.body.appendChild(a);a.click();a.remove();}catch(e){}const d=$('#dump');d.hidden=false;d.value=txt;d.select();};
 $('#im').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||o.v!==1)throw 0;S=Object.assign(fresh(),o);save();applyTheme();toast('Progress imported');route();}catch(err){alert('That file is not a valid progress export.');}};r.readAsText(f);};
 $('#rs').onclick=()=>{if(confirm('Erase all progress, scores, flashcard boxes and the mistake log?')){S=fresh();save();applyTheme();route();}};
}

window.__APP={QB,UNITS,CARDS,UNIT,QID,state:()=>S,examQs};
route();
})();
</script>
